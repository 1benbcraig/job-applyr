    resume: '', coverletter: '', openQuestions: '', portfolioGuidance: [],
    generating: false, materialsError: '',
    sourceUrl: '', appliedDate: '', rejectedDate: '', response_status: 'none', interview_date: ''
  }, raw || {});

  job.addedDate = job.addedDate || today;
  job.postedDateIso = job.postedDateIso || job.addedDate;
  job.postedDate = job.postedDate || formatDate(job.postedDateIso);
  // Both identifiers are made unique HERE, before buildDuplicateCheck() runs
  // below. That ordering is the whole point (D-13): the duplicate check excludes
  // the record from its own priors by comparing storageKey, so a key that is
  // still tentative makes a same-company-same-day duplicate filter out the very
  // prior it is looking for. Only assign when absent — a record reloaded from
  // storage keeps its key, or it would be orphaned from the row it was saved as.
  job.storageKey = job.storageKey || uniqueValue(storageKeyFor(job),
                     new Set((existingJobs || []).map(j => j.storageKey)));
  if (!job.id) {
    job.id = uniqueValue(slugify(job.company) + '-' + job.addedDate,
                         new Set((existingJobs || []).map(j => j.id)));
  }
  job.duplicateCheck = buildDuplicateCheck(job, existingJobs);
  return job;
}

// D-13 repair. Records added before this build stored isReapply:false whenever
// they duplicated a same-company-same-day row, so their ↻ marker never showed.
// Recompute the stored value in ADD ORDER, so each record sees only what came
// before it and priors stay priors rather than every row pointing at every other.
// storageKey order is add order: the date prefix orders across days, the -2/-3
// suffix within one. (Ten same-day duplicates of one company would sort -10
// ahead of -2. Not worth handling.) Returns only the records that changed.
function recomputeDuplicateChecks(jobs) {
  const list = (jobs || []).slice()
    .sort((a, b) => String(a.storageKey || '').localeCompare(String(b.storageKey || '')));
  const changed = [];
  const earlier = [];
  list.forEach(job => {
    const before = JSON.stringify(job.duplicateCheck || null);
    job.duplicateCheck = buildDuplicateCheck(job, earlier);
    if (JSON.stringify(job.duplicateCheck) !== before) changed.push(job);
    earlier.push(job);
  });
  return changed;
}

// Records written before the id fix can already be carrying a shared id.
// Repair them on load, keyed off storageKey — that has always been unique, and
// id is the field that can't be trusted here. Oldest key keeps the base id, so
// whichever record was written first is the one that doesn't change. Returns
// only the records that actually changed, for saving back.
function repairJobIds(jobs) {
  const list = (jobs || []).slice()
    .sort((a, b) => String(a.storageKey || '').localeCompare(String(b.storageKey || '')));
  const counts = new Map();
  list.forEach(j => { if (j.id) counts.set(j.id, (counts.get(j.id) || 0) + 1); });
  // Ids that are already unique are reserved first and never touched, so a
  // record that was fine keeps its id and only the collided ones move.
  const taken = new Set(list.filter(j => j.id && counts.get(j.id) === 1).map(j => j.id));
  const repaired = [];
  list.forEach(job => {
    if (job.id && counts.get(job.id) === 1) return;
    const base = job.id || (slugify(job.company) + '-' + (job.addedDate || ''));
    const unique = uniqueValue(base, taken);
    taken.add(unique);
    if (unique !== job.id) { job.id = unique; repaired.push(job); }
  });
  return repaired;
}

// ---- Job Applyr 1 import: 84 record folders on disk, read once ----
// D-18 as amended by D-20 and D-21. The source folder is opened read-only and
// is never written to.

// Recorded alongside the other one-time migrations. A second run would not
// overwrite the first: normalizeJob() makes both identifiers unique (D-13), so
// it would ADD 84 more rows, every one of them marked D. See D-20 §8.
const IMPORT_FLAG = 'importJobApplyr1V1';

// The six files a Job Applyr 1 record folder can hold. Read by exact name, so
// the .bak- copies sitting in some folders are ignored without a rule.
const IMPORT_OPTIONAL_FILES = ['posting.md', 'status.md', 'resume.md', 'coverletter.md'];

// Tolerant on purpose, and lifted from subfolder-probe.html, which was run
// against all 84 real records before this build existed. Three real shapes:
//   74 analysis.md and 56 status.md open and close with ---
//   10 analysis.md open with --- and never close
//   28 status.md have no --- lines at all, keys from line 1
// A conventional /^---\n(...)\n---/ parser returns nothing for the last two
// groups — 10 job records and 28 status records, including 7 of the 17 applied
// flags — and it fails quietly. See D-20 §1.
//
// ONE addition to the probe's version. verdict_reasoning is a YAML block scalar
// ("verdict_reasoning: |") in 56 of the 84, with its real text on the indented
// lines below. The probe only ever counted keys, so reading the value back as
// "|" cost it nothing; an import built on it would have written the single
// character "|" into notes on 56 records. Block scalars are now consumed.
function importFrontmatter(text) {
  const rows = String(text || '').split(/\r?\n/);
  let i = 0, hadOpen = false, closed = false;
  if (rows.length && rows[0].trim() === '---') { i = 1; hadOpen = true; }
  const out = {};
  for (; i < rows.length; i++) {
    const L = rows[i];
    if (L.trim() === '---') { closed = true; break; }
    if (/^#{2,6}\s/.test(L)) break;   // a markdown section heading = the body has started
    if (/^#/.test(L)) continue;       // a comment line
    const mm = L.match(/^([A-Za-z0-9_]+):[ \t]*(.*)$/);
    if (!mm) continue;
    const key = mm[1];
    let value = mm[2].trim();
    if (/^[|>][-+0-9]*$/.test(value)) {
      // The value is the indented lines that follow. Column 0 ends the block.
      const block = [];
      let j = i + 1;
      for (; j < rows.length; j++) {
        if (rows[j].trim() === '') { block.push(''); continue; }
        if (!/^[ \t]/.test(rows[j])) break;
        block.push(rows[j].replace(/^[ \t]+/, ''));
      }
      i = j - 1;
      value = block.join('\n').trim();
    } else {
      value = value.replace(/^["']/, '').replace(/["']$/, '');
    }
    // First occurrence wins. A body line reading "Gap:" or "Concerns:" looks
    // like a key and must not overwrite the real one.
    if (!Object.prototype.hasOwnProperty.call(out, key)) out[key] = value;
  }
  out.__shape = hadOpen ? (closed ? 'delimited-closed' : 'delimited-unclosed') : 'no-delimiters';
  return out;
}

// A missing optional file is not an error; anything else is.
async function importReadIfPresent(dirHandle, name) {
  try {
    const fh = await dirHandle.getFileHandle(name);
    const f = await fh.getFile();
    return await f.text();
  } catch (e) {
    if (e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError')) return null;
    throw e;
  }
}

// The lines under one "## Heading", up to the next "##" or the end of the file.
function importSection(text, heading) {
  const rows = String(text || '').split(/\r?\n/);
  const head = new RegExp('^##\\s+' + heading + '\\s*$', 'i');
  const start = rows.findIndex(r => head.test(r));
  if (start === -1) return [];
  const out = [];
  for (let i = start + 1; i < rows.length; i++) {
    if (/^##\s/.test(rows[i])) break;
    out.push(rows[i]);
  }
  return out;
}
function importStripBullet(line) {
  return String(line || '').replace(/^\s*(?:[-*•]|\d+\.)\s+/, '').trim();
}

// Every non-empty line of a fit section becomes one item, verbatim, with no
// tone. Six analyzer versions wrote these sections differently and only about a
// third use bullets, so a tone inferred from a "Strong:" or "Gap:" prefix would
// assert a judgement the source never made. readToneItem() takes a plain string
// and renders it as a plain grey bullet, deliberately smaller than a toned one.
// See D-20 §5.
function importFitItems(text, heading) {
  return importSection(text, heading).map(importStripBullet).filter(Boolean);
}

// "contract-to-hire, no salary listed" is two flags. Commas inside brackets
// belong to the text — "annualized base $175,140" is one flag, not two.
// A literal "none" is not a flag; 56 of the 84 records carry a real one.
function importFlags(raw) {
  const s = String(raw || '').trim();
  if (!s || s === '[]' || /^none$/i.test(s)) return { flagReason: '', flagCount: 0 };
  const parts = [];
  let depth = 0, cur = '';
  for (const ch of s) {
    if (ch === '(' || ch === '[') depth++;
    else if (ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
    if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; continue; }
    cur += ch;
  }
  parts.push(cur);
  return { flagReason: s, flagCount: parts.map(p => p.trim()).filter(Boolean).length };
}

// portfolio_picks is a JSON array in status.md, non-empty in 5 of the 84.
// Lite regenerates portfolio guidance whenever materials are drafted, so for
// the other 79 this is a field that fills itself the moment it matters.
// The prose sections are deliberately not parsed. See D-20 §7.
function importPortfolioPicks(raw) {
  const s = String(raw || '').trim();
  if (!s || s === '[]' || s === 'null') return [];
  let names = [];
  try {
    const v = JSON.parse(s);
    if (Array.isArray(v)) names = v.map(x => String(x == null ? '' : x).trim());
  } catch (_) {
    names = s.replace(/^\[/, '').replace(/\]$/, '').split(',')
      .map(x => x.trim().replace(/^["']/, '').replace(/["']$/, ''));
  }
  return names.filter(Boolean).map(n => ({ useCase: n, justification: '' }));
}

// status.md's manual_verdict is the user's own correction. It is non-empty in
// 27 records and disagrees with the analyzer in 25 of them — 14 Flag→Reject,
// 9 Flag→Apply, 2 Apply→Reject. The analyzer's verdict is a first guess; the
// person who owns the outcome overruled it, and that is the newer fact.
// Importing on the analyzer's verdict alone put 25 jobs in the wrong bucket.
// See D-20 §2.
function importEffectiveVerdict(fm, sf) {
  const manual = String((sf && sf.manual_verdict) || '').trim();
  const auto = String((fm && fm.verdict) || '').trim();
  return (manual || auto).toUpperCase();
}

// Scores are 0-100 integers in all 84 records today, so parsingError should
// never fire. If it does, the record needs looking at rather than waving
// through: the detail view swaps the score for "score unavailable" and says
// which field could not be read.
function importScore(raw) {
  const n = parseInt(String(raw == null ? '' : raw).trim(), 10);
  return Number.isFinite(n) ? n : null;
}

// One record folder -> the raw object normalizeJob() expects. Pure: no storage,
// no handles, so it can be run over the real folders outside the browser.
function importRecordToRaw(files) {
  const fm = importFrontmatter(files.analysis);
  const sf = files.status ? importFrontmatter(files.status) : {};
  const verdict = importEffectiveVerdict(fm, sf);
  const applied = String(sf.applied || '').trim().toLowerCase() === 'true';
  const qual = importScore(fm.qualification_fit_score);
  const env = importScore(fm.environment_fit_score);
  const flags = importFlags(fm.verdict_flags);

  const reasoning = String(fm.verdict_reasoning || '').trim();
  const manualReason = String(sf.manual_verdict_reason || '').trim();
  const notes = [reasoning, manualReason ? 'Manual verdict reason: ' + manualReason : '']
    .filter(Boolean).join('\n\n');

  const raw = {
    company: fm.company || 'Unknown',
    title: fm.role_title || 'Untitled role',
    location: fm.location || '',
    salary: fm.salary_range || 'Not listed',
    sourceUrl: fm.url || '',
    verdict: verdict,
    // An applied job stays in Applied whatever its outcome. response_status
    // carries the outcome, and the Applied tab groups employer rejections to
    // the bottom under their own heading. The rejected BUCKET means the user
    // rejected the job; "Rejected by employer" means they rejected him. Two
    // different facts, two different places. See D-21.
    bucket: applied ? 'applied' : (VERDICT_BUCKET[verdict] || 'unassigned'),
    qualFit: qual == null ? 0 : qual,
    envFit: env == null ? 0 : env,
    flagReason: flags.flagReason,
    flagCount: flags.flagCount,
    notes: notes,
    qualItems: importFitItems(files.analysis, 'Qualification Fit'),
    envItems: importFitItems(files.analysis, 'Environment Fit'),
    openQuestions: importSection(files.analysis, 'Open Questions')
      .map(importStripBullet).filter(Boolean).join('\n'),
    portfolioGuidance: importPortfolioPicks(sf.portfolio_picks),
    fullPosting: files.posting || '',
    // Written by a Node process in the user's own timezone, so these are
    // already local calendar days. Carried across as written and never
    // re-derived. See D-16 and D-18 §3.
    addedDate: fm.date_evaluated || '',
    postedDateIso: fm.date_evaluated || '',
    appliedDate: applied ? String(sf.date_applied || '').trim() : '',
    response_status: applied ? (String(sf.response_status || '').trim().toLowerCase() || 'none') : 'none',
    interview_date: applied ? String(sf.interview_date || '').trim() : '',
    // Documents carry over on applied jobs only. For a job already applied to,
    // the letter is the record of what was actually sent. For one not yet
    // applied, D-05's never-overwrite guard would leave a stale letter sitting
    // there permanently, blocking a fresh draft. See D-18 §2.
    resume: applied ? (files.resume || '') : '',
    coverletter: applied ? (files.coverletter || '') : ''
  };
  // Left absent rather than set false, so the field means what it says.
  if (qual == null || env == null) raw.parsingError = true;
  return raw;
}

class App {
  constructor() {
    this.state = {
      view: 'review', activeBucket: 'ready', selectedId: null, activeTab: 'analysis',
      sortField: 'posted', sortDir: 'desc',
      flaggingOpen: false, flagReasonInput: '', rejectingOpen: false, rejectReasonInput: '',
      applyingOpen: false, applyReasonInput: '',
      questionsEditing: false, resumeEditing: false, coverEditing: false,
      uploadText: '', uploadUrl: '', dragOver: false, toast: '',
      pending: [], analyzing: false, analyzeDone: 0, analyzeTotal: 0, analyzeErrors: [], gradeError: '',
      jobs: [], loading: true, storageError: '',
      importing: false, importProgress: 0, importDone: null, importError: ''
    };
    this.render();
    this.boot();
  }

  async boot() {
    await store.init();
    try {
      const [jobs, pending, ui] = await Promise.all([store.listJobs(), store.listPending(), store.getUiState()]);
      console.log('Job Applyr Lite build _' + APP_VERSION);

      // Profile first: grading and drafting are meaningless without it, and the
      // Add Job screen has to know whether to show the folder-setup block.
      try { await loadProfile(false); }
      catch (e) { console.error('Profile load failed:', e); profileSource.error = String(e && e.message || e); }
      console.log('Profile: ' + profileSource.from + (profileSource.folderName ? ' (' + profileSource.folderName + ')' : ''));

      const dirty = new Map();
      const repaired = repairJobIds(jobs);
      if (repaired.length) {
        console.log('Repaired ' + repaired.length + ' colliding job id(s):', repaired.map(j => j.storageKey + ' -> ' + j.id));
        repaired.forEach(j => dirty.set(j.storageKey, j));
      }

      // One-time only: the recompute is O(n²) in stored jobs, and re-running it
      // every launch would also quietly rewrite history whenever a row is deleted.
      const migrations = await store.getMigrations();
      const needsRecompute = !migrations.duplicateCheckV1;
      if (needsRecompute) {
        const rechecked = recomputeDuplicateChecks(jobs);
        console.log('Recomputed duplicateCheck on ' + rechecked.length + ' record(s):',
                    rechecked.map(j => j.storageKey + ' isReapply=' + j.duplicateCheck.isReapply));
        rechecked.forEach(j => dirty.set(j.storageKey, j));
      }

      // Flag only after the writes land, so a failed save doesn't skip the
      // migration for good — a half-migrated run just re-runs next launch.
      if (dirty.size) await Promise.all([...dirty.values()].map(j => store.saveJob(j)));
      if (needsRecompute) await store.saveMigrations(Object.assign({}, migrations, { duplicateCheckV1: true }));
      this.setState(Object.assign({
        jobs, pending, loading: false,
        importDone: migrations[IMPORT_FLAG] || null,
        activeBucket: ui.activeBucket || 'ready',
        sortField: ui.sortField || 'posted',
        sortDir: ui.sortDir || 'desc'
      }));
    } catch (e) {
      console.error('Failed to load from storage:', e);
      this.setState({ loading: false, storageError: 'Could not read saved jobs. Try reloading.' });
    }
  }

  persistJob(id) {
    const job = this.state.jobs.find(j => j.id === id);
    // "generating" is a live-run flag only. Persisting it would leave a job
    // stuck showing "Drafting…" if the tab closed mid-draft.
    if (job) store.saveJob(Object.assign({}, job, { generating: false }));
  }
  persistUi() {
    const { activeBucket, sortField, sortDir } = this.state;
    store.saveUiState({ activeBucket, sortField, sortDir });
  }
  setState(updates) { this.state = Object.assign({}, this.state, updates); this.render(); }

  // Generates application materials for one job. The guard is absolute: if a
  // document already has content — generated or hand-edited — it is left alone.
  // Only an explicit regenerate, which clears the field first, replaces it.
  async generateMaterials(id) {
    const job = this.state.jobs.find(j => j.id === id);
    if (!job) return { ok: false, message: 'job not found' };
    const needsResume = !String(job.resume || '').trim();
    const needsCover = !String(job.coverletter || '').trim();
    if (!needsResume && !needsCover) return { ok: true, skipped: true };

    this.state.jobs = this.state.jobs.map(j => j.id === id ? Object.assign({}, j, { generating: true, materialsError: '' }) : j);
    this.render();

    const problems = [];
    let resume = job.resume, coverletter = job.coverletter;

    if (needsResume) {
      try { resume = await generateResume(job); }
      catch (e) { problems.push('resume: ' + (e.message || 'failed')); }
    }
    if (needsCover) {
      try { coverletter = await generateCoverLetter(job); }
      catch (e) { problems.push('cover letter: ' + (e.message || 'failed')); }
    }

    // Re-read from state: the user may have typed while this was running, and
    // their words win over anything generated.
    this.state.jobs = this.state.jobs.map(j => {
      if (j.id !== id) return j;
      const keepResume = String(j.resume || '').trim() ? j.resume : resume;
      const keepCover = String(j.coverletter || '').trim() ? j.coverletter : coverletter;
      return Object.assign({}, j, {
        resume: keepResume || '',
        coverletter: keepCover || '',
        generating: false,
        materialsError: problems.join('; ')
      });
    });
    this.persistJob(id);
    this.render();
    return { ok: !problems.length, message: problems.join('; ') };
  }

  // Regenerates ONE document. Clearing just that field is enough: the guard in
  // generateMaterials only drafts what is empty, so the other document is left
  // untouched. Worth doing when the generation rules have changed — rerunning
  // the same prompt unchanged mostly returns the same draft.
  async regenerateDoc(id, field) {
    const job = this.state.jobs.find(j => j.id === id);
    if (!job) return;
    const label = field === 'resume' ? 'resume' : 'cover letter';
    if (String(job[field] || '').trim()
      && !window.confirm('Replace this ' + label + ' with a new draft? Any edits you have made to it will be lost. The other document is not affected.')) return;
    this.state.jobs = this.state.jobs.map(j => j.id === id ? Object.assign({}, j, { [field]: '', materialsError: '' }) : j);
    await this.generateMaterials(id);
  }

  moveJob(id, bucket, reason) {
    // A silent no-op here looked exactly like a dead button. If the id in the
    // clicked row matches no record, say so instead of re-rendering nothing.
    if (!this.state.jobs.some(j => j.id === id)) {
      console.warn('moveJob: no job with id', JSON.stringify(id), '- ids present:', this.state.jobs.map(j => j.id));
      this.setState({ toast: 'Could not update that row. Reload the page and try again.' });
      return;
    }
    const today = todayLocal();
    this.state.jobs = this.state.jobs.map(j => {
      if (j.id !== id) return j;
      const extra = {};
      if (bucket === 'applied' && !j.appliedDate) extra.appliedDate = today;
      if (bucket === 'rejected' && !j.rejectedDate) extra.rejectedDate = today;
      return Object.assign({}, j, { bucket, flagReason: reason !== undefined ? reason : j.flagReason }, extra);
    });
    // Lite writes the whole job record back to its own storage key — the manual
    // verdict lives on the record itself, since there's no status.md to sync to.
    const manualVerdict = { ready: 'Apply', flagged: 'Flag', rejected: 'Reject' }[bucket];
    if (manualVerdict || bucket === 'applied') {
      this.state.jobs = this.state.jobs.map(j => j.id !== id ? j : Object.assign({}, j,
        bucket === 'applied'
          ? { applied: true, date_applied: today }
          : { manual_verdict: manualVerdict, manual_verdict_reason: reason || '' }
      ));
    }
    this.persistJob(id);
    this.render();
    // Moving a job into Apply is a decision to apply, so the materials are
    // drafted straight away. The guard inside generateMaterials means an
    // out-and-back move never overwrites work already there.
    if (bucket === 'ready') this.generateMaterials(id);
  }

  updateJobField(id, field, value) {
    this.state.jobs = this.state.jobs.map(j => j.id === id ? Object.assign({}, j, { [field]: value }) : j);
    // Every edited field — notes, open questions, resume, cover letter, response
    // status — is part of the single job record, so one write covers all of them.
    // No field can silently revert on reload the way the old split localStorage/
    // status.md path allowed.
    this.persistJob(id);
  }
  setResponseStatus(id, value) {
    if (value !== 'interview') this.updateJobField(id, 'interview_date', '');
    this.updateJobField(id, 'response_status', value);
    this.render();
  }
  setInterviewDate(id, value) {
    this.updateJobField(id, 'interview_date', value);
    this.render();
  }

  render() {
    // Cleared before building the markup; only the document tab sets it again.
    // Otherwise navigating away would leave a stale editor request behind.
    this._pendingQuill = null;
    const html = this.navHTML() + (
      this.state.view === 'upload' ? this.uploadHTML() :
      this.state.view === 'unassigned' ? this.unassignedHTML() :
      this.state.view === 'detail' ? this.detailHTML() :
      this.reviewHTML()
    );
    document.getElementById('root').innerHTML = html;
    this.attachEventListeners();
  }

  unassignedHTML() {
    const jobs = (this.state.jobs || []).filter(j => j.bucket === 'unassigned');
    const rows = jobs.map(j => `
      <tr style="cursor:pointer" onclick="app.openJob('${j.id}')">
        <td style="text-transform:uppercase;font-size:14px;letter-spacing:0.04em" class="text-muted">${escapeHtml(j.company)}</td>
        <td>${escapeHtml(j.title)}</td>
        <td class="text-muted">${escapeHtml(j.location)}</td>
        <td class="text-muted">${escapeHtml(j.postedDate)}</td>
        <td class="text-muted" style="font-size:14px">${escapeHtml(j.verdict || 'undetermined')}</td>
      </tr>
    `).join('');
    return `
      <main>
        <h2 style="margin-bottom:var(--space-1);font-size:20px;color:var(--color-neutral-700)">Unassigned</h2>
        <p class="text-muted" style="margin-bottom:var(--space-6);font-size:13px">Operator view. Jobs with no verdict the analyzer could assign — no verdict field, or a value outside Apply/Flag/Reject. Not part of the normal review flow.</p>
        <table class="table">
          <thead><tr><th>Company</th><th>Title</th><th>Location</th><th>Posted</th><th>Raw verdict</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${jobs.length === 0 ? '<p class="text-muted" style="margin-top:var(--space-4)">Nothing unassigned right now.</p>' : ''}
      </main>
    `;
  }

  navTabStyle(active) {
    return 'text-decoration:none;padding:var(--space-2) 0;border-bottom:' + (active ? '2px solid var(--color-accent)' : '2px solid transparent')
      + ';color:' + (active ? 'var(--color-accent-700)' : 'var(--color-neutral-800)') + ';margin-bottom:-1px;font-size:15px';
  }

  navHTML() {
    const { view, jobs } = this.state;
    const isReview = view === 'review' || view === 'detail';
    const pendingCount = (this.state.pending || []).length;
    const unassignedCount = (jobs || []).filter(j => j.bucket === 'unassigned').length;
    return `
      <nav class="nav" style="gap:24px;padding-left:0;padding-right:0">
        <div style="display:flex;align-items:center;gap:24px;max-width:1120px;width:100%;margin:0 auto;padding:0 var(--space-4);box-sizing:border-box">

  uploadHTML() {

          ${!store.persistent() ? `<p style="font-size:14px;color:var(--color-flagged-700);margin:0 0 var(--space-2)">Saved postings and graded jobs will be lost when this tab closes. Persistent storage is not available here (${escapeHtml(store.probe)}).</p>` : ''}

              <p style="font-size:14px;font-weight:600;margin:0 0 var(--space-1)">One-time setup: choose your profile folder</p>
              <p class="text-muted" style="font-size:14px;margin:0 0 var(--space-2)">Grading and drafting read five files from a folder on this computer. Pick that folder once and the app re-reads it every time it opens, so editing a file in a text editor is all it takes to change how it works.</p>
              <p class="text-muted" style="font-size:13px;margin:0 0 var(--space-2)">The folder should contain: ${PROFILE_FILES.map(f => f[1]).join(', ')}</p>
              <button type="button" class="btn btn-secondary" onclick="app.chooseProfileFolder();return false;">Choose folder</button>
              ${profileSource.error ? `<p style="font-size:14px;color:var(--color-rejected-700);margin:var(--space-2) 0 0">${escapeHtml(profileSource.error)}</p>` : ''}
            </div>

            <p class="text-muted" style="font-size:13px;margin:0 0 var(--space-2);display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap">

            ${profileSource.error ? `<p style="font-size:13px;color:var(--color-rejected-700);margin:0 0 var(--space-2)">${escapeHtml(profileSource.error)}</p>` : ''}
          `}
          ${(() => {
            const done = this.state.importDone;
            const busy = this.state.importing;
            const err = this.state.importError;

                <div style="border:1px solid var(--color-neutral-300);padding:var(--space-4);margin:var(--space-4) 0">
                  <p style="font-size:14px;font-weight:600;margin:0 0 var(--space-1)">Existing job records: imported</p>
                  <p class="text-muted" style="font-size:14px;margin:0 0 var(--space-1)">${done.added} record${done.added === 1 ? '' : 's'} added on ${escapeHtml(formatDate(done.ranAt) || done.ranAt)}: ${c.rejected || 0} Rejected, ${c.applied || 0} Applied, ${c.ready || 0} Ready to Apply, ${c.flagged || 0} Flagged, ${c.unassigned || 0} Unassigned.</p>
                  <p class="text-muted" style="font-size:14px;margin:0 0 var(--space-1)">Inside Applied: ${r.interview || 0} interview scheduled, ${r.none || 0} no response, ${r.rejected || 0} rejected by employer.</p>
                  ${done.unreadable ? `<p style="font-size:14px;color:var(--color-rejected-700);margin:0 0 var(--space-1)">${done.unreadable} record${done.unreadable === 1 ? '' : 's'} had a fit score that could not be read. Those show a warning in place of the score.</p>` : ''}

                  <p class="text-muted" style="font-size:13px;margin:0">This runs once. Running it again would add a second copy of every record rather than replacing them, so the button is gone.</p>

              <div style="border:1px solid var(--color-neutral-300);padding:var(--space-4);margin:var(--space-4) 0">
                <p style="font-size:14px;font-weight:600;margin:0 0 var(--space-1)">One-time setup: import your existing job records</p>
                <p class="text-muted" style="font-size:14px;margin:0 0 var(--space-2)">If you tracked jobs before this app, point it at the folder holding one folder per job. It reads them and adds them here, with their verdicts, scores, notes and postings. Applied jobs keep the resume and cover letter that were actually sent.</p>
                <p class="text-muted" style="font-size:13px;margin:0 0 var(--space-2)">The original folder is only read. Nothing in it is changed, moved or deleted. This can only be done once.</p>
                <button type="button" class="btn btn-secondary" ${busy ? 'disabled' : ''} onclick="app.importFromDisk();return false;">${busy ? `Reading… ${this.state.importProgress} record${this.state.importProgress === 1 ? '' : 's'}` : 'Choose the folder'}</button>
                ${err ? `<p style="font-size:14px;color:var(--color-rejected-700);margin:var(--space-2) 0 0">${escapeHtml(err)}</p>` : ''}
              </div>
            `;
          })()}
          ${!hasApiKey() ? `
            <div style="border:1px solid var(--color-neutral-300);padding:var(--space-4);margin:var(--space-4) 0">
              <p style="font-size:14px;font-weight:600;margin:0 0 var(--space-1)">One-time setup: add an API key</p>
              <p class="text-muted" style="font-size:14px;margin:0 0 var(--space-2)">Analysis needs a key from console.anthropic.com. It is stored in this browser only and is sent nowhere except Anthropic. You only do this once.</p>
              <div style="display:flex;gap:var(--space-2);align-items:center">
                <input id="api-key" class="input" type="password" placeholder="sk-ant-..." style="flex:1" autocomplete="off">
                <button type="button" class="btn btn-secondary" onclick="app.saveApiKey();return false;">Save key</button>
              </div>
            </div>
          ` : ''}
          <div class="field" style="padding-top:24px;padding-bottom:var(--space-2)">
            <label for="jd-url" style="display:block;font-size:14px;color:var(--color-neutral-700);margin-bottom:var(--space-1)">Source URL (optional)</label>
            <input id="jd-url" class="input" type="url" placeholder="https://www.linkedin.com/jobs/view/..." value="${escapeHtml(uploadUrl)}" ${busy ? 'disabled' : ''} oninput="app.state.uploadUrl=this.value">
          </div>
          <div class="field" style="padding-top:var(--space-2);padding-bottom:24px">
            <label for="jd-paste" style="display:none">Job posting</label>
            <textarea id="jd-paste" class="input" rows="14" placeholder="Paste job posting here" ${busy ? 'disabled' : ''}
              style="text-align:left;height:340px;padding:var(--space-4)" oninput="app.state.uploadText=this.value">${escapeHtml(uploadText)}</textarea>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-4)">
            <button type="button" class="btn btn-primary" ${(busy || !count) ? 'disabled' : ''} onclick="app.runAnalysis();return false;">${busy ? `Analyzing ${analyzeDone + 1} of ${analyzeTotal}…` : 'Run analysis'}</button>
            <button type="button" class="btn btn-secondary jd-tooltip" data-tooltip="Holds this posting for the next analysis run" ${busy ? 'disabled' : ''} onclick="app.handleSave();return false;">Save</button>
          </div>
          ${toast ? `<div class="tag tag-accent" style="margin-top:var(--space-4)">${escapeHtml(toast)}</div>` : ''}
          ${(analyzeErrors && analyzeErrors.length && !busy) ? `
            <p style="margin-top:var(--space-4);font-size:14px;color:var(--color-rejected-700)">${analyzeErrors.length} posting${analyzeErrors.length > 1 ? 's' : ''} could not be graded and ${analyzeErrors.length > 1 ? 'are' : 'is'} still pending: ${escapeHtml(analyzeErrors.map(e => e.label + ' (' + e.message + ')').join('; '))}</p>
          ` : ''}
        </div>
      </main>
    `;
  }

  saveApiKey() {
    const el = document.getElementById('api-key');
    const key = ((el && el.value) || '').trim();
    if (!key) { this.setState({ toast: 'Paste your API key first.' }); return; }
    if (!setApiKey(key)) { this.setState({ toast: 'Could not save the key. Browser storage is unavailable.' }); return; }
    this.setState({ toast: 'Key saved. You will not be asked again on this computer.' });
  }

  async handleSave() {
    const el = document.getElementById('jd-paste');
    const urlEl = document.getElementById('jd-url');
    const text = ((el && el.value) || '').trim();
    const url = ((urlEl && urlEl.value) || '').trim();
    if (!text) { this.setState({ toast: 'Paste a job posting first.' }); return; }

    const now = new Date();
    const savedDate = todayLocal();
    // First substantial line is usually the role or company, which is enough to
    // recognize a posting in the list without grading it first.
    const label = (text.split('\n').map(l => l.trim()).find(l => l.length > 2) || 'Untitled posting').slice(0, 70);
    const item = {
      storageKey: PENDING_PREFIX + savedDate + '-' + now.getTime() + '-' + slugify(label).slice(0, 24),
      text, url, savedDate, savedAt: now.toISOString(), label,
      wordCount: text.split(/\s+/).filter(Boolean).length
    };

    const ok = await store.savePending(item);
    if (!ok) { this.setState({ toast: 'Could not save that posting. Try again.' }); return; }
    const pending = this.state.pending.concat([item]);
    this.setState({ pending, uploadText: '', uploadUrl: '', analyzeErrors: [], toast: `Saved. ${pending.length} posting${pending.length > 1 ? 's' : ''} waiting for analysis.` });
  }

  // Grades every saved posting. A posting that fails stays pending, so one bad
  // response can't quietly lose the rest of the run.
  async runAnalysis() {
    if (this.state.analyzing) return;
    const queue = (this.state.pending || []).slice();
    if (!queue.length) return;

    this.setState({ analyzing: true, analyzeDone: 0, analyzeTotal: queue.length, analyzeErrors: [], toast: '' });

    let jobs = this.state.jobs.slice();
    let stillPending = this.state.pending.slice();
    const errors = [];
    let added = 0;
    let lastJob = null;

    for (let i = 0; i < queue.length; i++) {
      const item = queue[i];
      try {
        const graded = await gradePosting(item.text, item.url);
        const raw = Object.assign({}, graded, {
          fullPosting: item.text,
          sourceUrl: item.url || '',
          bucket: VERDICT_BUCKET[String(graded.verdict || '').toUpperCase()] || 'unassigned',
          addedDate: item.savedDate,
          resume: '', coverletter: ''
        });
        // storageKey uniqueness used to be enforced here, after normalizeJob()
        // had already run the duplicate check against the tentative key. It now
        // happens inside normalizeJob(), before that check. See D-13.
        const job = normalizeJob(raw, jobs);

        if (await store.saveJob(job)) {
          jobs.push(job);
          lastJob = job;
          added++;
          await store.deletePending(item.storageKey);
          stillPending = stillPending.filter(p => p.storageKey !== item.storageKey);
        } else {
          errors.push({ label: item.label, message: 'graded, but saving it failed' });
        }
      } catch (e) {
        console.error('Grading failed for', item.label, e);
        errors.push({ label: item.label, message: e.message || 'Claude could not be reached' });
      }
      this.setState({ analyzeDone: i + 1, jobs, pending: stillPending });
    }

    // Phase two: everything graded Apply gets its materials drafted. Grading
    // finishes first so the list is readable while this runs.
    const toDraft = jobs.filter(j => j.bucket === 'ready' && !String(j.resume || '').trim() && !String(j.coverletter || '').trim());
    if (toDraft.length) {
      this.setState({ analyzing: false, jobs, pending: stillPending, analyzeErrors: errors,
        drafting: true, draftDone: 0, draftTotal: toDraft.length,
        view: 'review', activeBucket: 'ready',
        toast: `Graded ${added} posting${added > 1 ? 's' : ''}. Drafting materials for ${toDraft.length}…` });
      let failed = 0;
      for (let i = 0; i < toDraft.length; i++) {
        const r = await this.generateMaterials(toDraft[i].id);
        if (!r.ok) failed++;
        this.setState({ draftDone: i + 1 });
      }
      this.setState({
        drafting: false, jobs: this.state.jobs,
        toast: failed
          ? `Drafted ${toDraft.length - failed} of ${toDraft.length}. ${failed} need a retry, see the job.`
          : `Graded ${added} and drafted materials for ${toDraft.length}.`
      });
      return;
    }

    // Grading a single posting opens straight to it. A larger run returns to the
    // review list, unless something failed and is worth seeing.
    const single = added === 1 && queue.length === 1 && lastJob;
    this.setState({
      analyzing: false, jobs, pending: stillPending, analyzeErrors: errors,
      view: single ? 'detail' : (added && !errors.length ? 'review' : 'upload'),
      selectedId: single ? lastJob.id : this.state.selectedId,
      activeTab: single ? 'analysis' : this.state.activeTab,
      activeBucket: single && lastJob.bucket !== 'unassigned' ? lastJob.bucket : this.state.activeBucket,
      toast: added
        ? (single
            ? `${lastJob.company}: ${lastJob.verdict || 'no verdict'}.`
            : `Graded ${added} posting${added > 1 ? 's' : ''}${errors.length ? `, ${errors.length} failed` : ''}.`)
        : 'Nothing was graded.'
    });
  }

  reviewHTML() {
    const { activeBucket, jobs, sortField, sortDir, loading, storageError, toast } = this.state;
    const buckets = ['ready', 'flagged', 'rejected', 'applied'];

    if (loading) {
      return `<main><h2 style="margin-bottom:var(--space-6)">My jobs</h2><p class="text-muted">Loading saved jobs…</p></main>`;
    }
    if (storageError) {
      return `
        <main>
          <h2 style="margin-bottom:var(--space-6)">My jobs</h2>
          <div class="card elev-sm" style="max-width:640px;border:1px solid var(--color-rejected-700)">
            <span class="card-title" style="margin:0;font-size:16px;color:var(--color-rejected-700)">Storage unavailable</span>
            <p style="margin:var(--space-2) 0 0;color:var(--color-neutral-800)">${escapeHtml(storageError)}</p>
          </div>
        </main>`;
    }
    if (!jobs.length) {
      return `
        <main>
          <h2 style="margin-bottom:var(--space-2)">My jobs</h2>
          <p class="text-muted" style="margin-bottom:var(--space-6);max-width:560px">${(this.state.pending || []).length
            ? `${this.state.pending.length} posting${this.state.pending.length > 1 ? 's are' : ' is'} waiting for analysis. Run it to fill these buckets.`
            : 'Nothing tracked yet. Save a posting and run the analysis to start.'}</p>
          <div style="display:flex;gap:var(--space-2)">
            <button type="button" class="btn btn-primary" onclick="app.setState({view:'upload'})">${(this.state.pending || []).length ? 'Go to the saved postings' : 'Add a job'}</button>
          </div>
          ${toast ? `<div class="tag tag-accent" style="margin-top:var(--space-4)">${escapeHtml(toast)}</div>` : ''}
        </main>`;
    }

    const bucketCards = buckets.map(b => {
      const count = jobs.filter(j => j.bucket === b).length;
      const isActive = b === activeBucket;
      const bc = bucketColor(b);
      return `
        <button type="button" class="card jd-bucket-card ${isActive ? 'jd-bucket-active' : ''}"
          onclick="app.setBucket('${b}')"
          style="text-align:left;cursor:pointer;border:${isActive ? '2px' : '1px'} solid ${isActive ? `color-mix(in srgb, ${bc.text} 90%, black)` : 'var(--color-neutral-800)'};background:${isActive ? bc.bg : bc.bgFaded}">
          <div class="card-kicker" style="color:${bc.text}">${BUCKET_LABELS[b]}</div>
          <div style="font-family:var(--font-heading);font-weight:500;font-size:32px;line-height:1;color:var(--color-text)">${count}</div>
        </button>
      `;
    }).join('');

    // Default sort is posted-date-desc app-wide, EXCEPT the Flag bucket defaults to
    // fewest-flags-first (closest-to-clean options surface at the top) — the ranking
    // the user asked for. This only applies before the user has explicitly clicked a column
    // header; once sortField/sortDir differ from the pristine app-start default, an
    // explicit user choice always wins, in the Flag bucket same as anywhere else.
    const isPristineDefault = (sortField || 'posted') === 'posted' && (sortDir || 'desc') === 'desc';
    const sd = (activeBucket === 'flagged' && isPristineDefault) ? 'flags' : (sortField || 'posted');
    const dir = (activeBucket === 'flagged' && isPristineDefault) ? 'asc' : (sortDir || (sd === 'posted' ? 'desc' : 'asc'));
    const filtered = jobs.filter(j => j.bucket === activeBucket).slice().sort((a, b) => {
      let cmp;
      if (sd === 'company') cmp = a.company.localeCompare(b.company);
      else if (sd === 'title') cmp = a.title.localeCompare(b.title);
      else if (sd === 'salary') cmp = parseSalary(a.salary) - parseSalary(b.salary);
      else if (sd === 'flags') cmp = (a.flagCount || 0) - (b.flagCount || 0);
      else cmp = new Date(a.postedDateIso || 0) - new Date(b.postedDateIso || 0);
      return dir === 'desc' ? -cmp : cmp;
    });

    const postedLabel = activeBucket === 'applied' ? 'Applied on' : activeBucket === 'rejected' ? 'Rejected' : 'Posted';
    const arrow = (f) => sd === f ? (dir === 'desc' ? '↓' : '↑') : '';
    const showActions = activeBucket === 'ready' || activeBucket === 'flagged';
    const showFlags = activeBucket === 'flagged';
    const isApplied = activeBucket === 'applied';
    const appliedColspan = 6;
    const renderRow = (j) => {
      const dateShown = (activeBucket === 'applied' && j.appliedDate) ? formatDate(j.appliedDate)
        : (activeBucket === 'rejected' && j.rejectedDate) ? formatDate(j.rejectedDate) : j.postedDate;
      const rs = j.response_status || 'none';
      return `
        <tr class="jd-row" style="cursor:pointer" onclick="app.openJob('${j.id}')">
          <td style="text-transform:uppercase;font-size:14px;letter-spacing:0.04em" class="text-muted">${(j.duplicateCheck && j.duplicateCheck.isReapply)
            ? `<span class="jd-tooltip" data-tooltip="Duplicate — already in your list" style="background:${DUPE_HIGHLIGHT};padding:2px 6px">${escapeHtml(j.company)} - <strong style="color:${DUPE_MARK};font-weight:700">D</strong></span>`
            : escapeHtml(j.company)}</td>
          <td style="min-width:200px">${titleLink(j.title, j.sourceUrl, 11)}</td>
          <td class="text-muted">${escapeHtml(j.location)}</td>
          <td class="text-muted">${escapeHtml(j.salary)}</td>
          ${showFlags ? `<td class="text-muted" style="text-align:center">${j.flagCount || 0}</td>` : ''}
          <td class="text-muted">${dateShown}</td>
          <td style="text-align:right;white-space:nowrap" ${isApplied ? 'onclick="event.stopPropagation()"' : ''}>
            ${(j.duplicateCheck && j.duplicateCheck.isReapply) ? `
              <button type="button" class="btn btn-ghost" style="color:${DUPE_MARK}" onclick="event.stopPropagation();app.deleteJob('${j.id}');return false;">Delete</button>
            ` : ''}
            ${showActions ? `
              <button type="button" class="btn btn-ghost jd-btn-reject" onclick="event.stopPropagation();app.moveJob('${j.id}','rejected');return false;">Reject</button>
              <button type="button" class="btn btn-secondary jd-btn-applied" onclick="event.stopPropagation();app.moveJob('${j.id}','applied');return false;">Applied</button>
            ` : ''}
            ${isApplied ? `
              <select style="font-size:13px;padding:2px 4px" onchange="app.setResponseStatus('${j.id}', this.value)" onclick="event.stopPropagation()">
                <option value="none" ${rs === 'none' ? 'selected' : ''}>No response</option>
                <option value="rejected" ${rs === 'rejected' ? 'selected' : ''}>Rejected by employer</option>
                <option value="interview" ${rs === 'interview' ? 'selected' : ''}>Interview</option>
              </select>
              ${rs === 'interview' ? `<input type="date" value="${escapeHtml(j.interview_date || '')}" style="font-size:13px;margin-left:6px" onchange="app.setInterviewDate('${j.id}', this.value)" onclick="event.stopPropagation()">` : ''}
            ` : ''}
          </td>
        </tr>
      `;
    };
    let rows;
    if (isApplied) {
      const groups = [
        { key: 'interview', label: 'Interview scheduled' },
        { key: 'none', label: 'No response' },
        { key: 'rejected', label: 'Rejected by employer' }
      ];
      rows = groups.map((g, i) => {
        let groupJobs = filtered.filter(j => (j.response_status || 'none') === g.key);
        if (g.key === 'interview') {
          groupJobs = groupJobs.slice().sort((a, b) =>
            (a.interview_date || '9999-99-99').localeCompare(b.interview_date || '9999-99-99'));
        }
        const isEmpty = groupJobs.length === 0;
        const header = `
          <tr style="background:transparent"><td colspan="${appliedColspan}" style="padding-top:var(--space-2);padding-bottom:var(--space-2);border:none${i > 0 ? ';border-top:1px solid var(--color-divider)' : ''}">
            <span class="card-kicker" style="font-size:15px;font-weight:600">${g.label}</span>
          </td></tr>`;
        const body = isEmpty ? '' : groupJobs.map(renderRow).join('');
        return header + body;
      }).join('');
    } else {
      rows = filtered.map(renderRow).join('');
    }

    return `
      <main>
        <h2 style="margin-bottom:var(--space-6)">My jobs</h2>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:var(--space-8)">${bucketCards}</div>
        <table class="table">
          <thead><tr>
            <th style="cursor:pointer;white-space:nowrap" onclick="app.sortBy('company')">Company<span style="color:var(--color-accent);font-weight:600;font-size:11px;margin-left:4px">${arrow('company')}</span></th>
            <th style="cursor:pointer;white-space:nowrap;min-width:200px" onclick="app.sortBy('title')">Title<span style="color:var(--color-accent);font-weight:600;font-size:11px;margin-left:4px">${arrow('title')}</span></th>
            <th style="white-space:nowrap">Location</th>

  sortBy(field) {
    const { sortField, sortDir } = this.state;
    let dir;
    if (field === 'salary' || field === 'posted') dir = (sortField === field && sortDir === 'desc') ? 'asc' : 'desc';
    else dir = (sortField === field && sortDir === 'asc') ? 'desc' : 'asc';
    this.setState({ sortField: field, sortDir: dir });
    this.persistUi();
  }

  setBucket(bucket) {
    this.setState({ activeBucket: bucket });
    this.persistUi();
  }

  // Delete is offered only on rows marked as duplicates — the one case where a
  // record was never a real job. A rejection is history and stays in its bucket.
  // There is no undo, so this confirms first and names what goes with it.
  async deleteJob(id) {
    const job = this.state.jobs.find(j => j.id === id);
    if (!job) return;
    if (!window.confirm('Delete the ' + job.company + ' — ' + job.title + ' row?\n\nIts analysis, and any resume or cover letter drafted for it, are deleted with it. This cannot be undone.')) return;

    await store.deleteJob(job.storageKey);
    const jobs = this.state.jobs.filter(j => j.id !== id);

    // The remaining rows' duplicate marks were computed against a list that
    // included this record. Delete the earlier of a pair and the later one would
    // otherwise keep a D pointing at a row that no longer exists.
    const restated = recomputeDuplicateChecks(jobs);
    if (restated.length) await Promise.all(restated.map(j => store.saveJob(j)));

    this.setState({
      jobs,
      selectedId: this.state.selectedId === id ? null : this.state.selectedId,
      view: this.state.selectedId === id ? 'review' : this.state.view
    });
  }

  // Both of these are click handlers on purpose: Chrome only allows the folder
  // picker and the permission prompt to open from a real user gesture.
  async chooseProfileFolder() {
    try { await pickProfileFolder(); }
    catch (e) {
      if (e && e.name === 'AbortError') return;   // the user closed the picker
      profileSource.error = e && e.message ? e.message : String(e);
    }
    this.render();
  }

  async reloadProfile() {
    try { await loadProfile(true); }
    catch (e) { profileSource.error = e && e.message ? e.message : String(e); }
    this.render();
  }

  // Reads Job Applyr 1's record folders and adds them as Lite jobs. A click
  // handler on purpose: Chrome only opens the folder picker from a real gesture.
  async importFromDisk() {
    if (this.state.importing || this.state.importDone) return;
    if (typeof window.showDirectoryPicker !== 'function') {
      this.setState({ importError: 'This browser cannot open a folder picker. Chrome is required.' });
      return;
    }

    let dir;
    try {
      // A separate picker id from the profile folder, so Chrome offers the
      // right starting directory for each and neither overwrites the other.
      dir = await window.showDirectoryPicker({ id: 'ja-lite-import', mode: 'read' });
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // the user closed the picker
      this.setState({ importError: e && e.message ? e.message : String(e) });
      return;
    }

    this.setState({ importing: true, importError: '', importProgress: 0, toast: '' });

    // Read everything first, write second. The read is where a permission
    // problem or the wrong folder shows up, and failing there leaves storage
    // untouched. 311 files came back in 135 ms on the real data, so holding
    // them costs nothing. What happens if a WRITE fails halfway is untested:
    // the flag is recorded with however many records actually saved and the
    // failures are named on screen, because re-running is not a recovery path.
    const found = [];
    const skipped = [];
    const readErrors = [];
    try {
      for await (const entry of dir.values()) {
        if (entry.kind !== 'directory') continue;
        let analysis = null;
        try { analysis = await importReadIfPresent(entry, 'analysis.md'); }
        catch (e) { readErrors.push(entry.name + '/analysis.md — ' + e.name); continue; }
        // A subfolder with no analysis.md is not a job record.
        if (analysis === null) { skipped.push(entry.name); continue; }
        const files = { analysis: analysis };
        for (let i = 0; i < IMPORT_OPTIONAL_FILES.length; i++) {
          const name = IMPORT_OPTIONAL_FILES[i];
          try { files[name.replace(/\.md$/, '')] = await importReadIfPresent(entry, name); }
          catch (e) { readErrors.push(entry.name + '/' + name + ' — ' + e.name); }
        }
        found.push({ folder: entry.name, files: files });
        this.setState({ importProgress: found.length });
      }
    } catch (e) {
      this.setState({ importing: false, importError: 'Could not read that folder: '
        + (e && e.message ? e.message : String(e)) + '. Nothing was imported.' });
      return;
    }

    if (!found.length) {
      this.setState({ importing: false, importError: 'No job records in that folder. Pick the applications folder itself — the one holding a folder per job, each with an analysis.md inside.' });
      return;
    }

    // Every record goes through normalizeJob() against the list built so far,
    // so storageKey and id are made unique in one place and the duplicate check
    // sees only the records that came before it. Job Applyr 1's folder names
    // repeat, so they are not unique enough to trust. See D-12 and D-13.
    //
    // ORDER IS THE ANSWER HERE, so it is fixed before anything is created.
    // buildDuplicateCheck() marks a record when it has already seen a matching
    // one, so the D lands on whichever of a pair is created second — and
    // dir.values() makes no promise about order. On the first real run it
    // handed back the newer record of every pair first, which put all three
    // marks on the OLDER row, the opposite of D-14's rule. Sorting by the
    // evaluated date is the same thing recomputeDuplicateChecks() does when it
    // sorts by storageKey; the folder name breaks a same-day tie so two
    // postings from one company on one day are still deterministic. See D-24.
    const ordered = found
      .map(rec => ({ folder: rec.folder, raw: importRecordToRaw(rec.files) }))
      .sort((a, b) => String(a.raw.addedDate || '').localeCompare(String(b.raw.addedDate || ''))
                      || String(a.folder).localeCompare(String(b.folder)));

    const jobs = this.state.jobs.slice();
    const added = [];
    const saveFailures = [];
    for (let i = 0; i < ordered.length; i++) {
      const job = normalizeJob(ordered[i].raw, jobs);
      if (await store.saveJob(job)) { jobs.push(job); added.push(job); }
      else saveFailures.push(ordered[i].folder);
      this.setState({ importProgress: i + 1 });
    }

    const counts = { rejected: 0, applied: 0, ready: 0, flagged: 0, unassigned: 0 };
    const responses = { interview: 0, none: 0, rejected: 0 };
    added.forEach(j => {
      counts[j.bucket] = (counts[j.bucket] || 0) + 1;
      if (j.bucket === 'applied') responses[j.response_status] = (responses[j.response_status] || 0) + 1;
    });

    const summary = {
      ranAt: todayLocal(), added: added.length, found: found.length,
      counts: counts, responses: responses, skipped: skipped,
      unreadable: added.filter(j => j.parsingError).length
    };
    const migrations = await store.getMigrations();
    const next = Object.assign({}, migrations);
    next[IMPORT_FLAG] = summary;
    await store.saveMigrations(next);

    this.setState({
      importing: false, jobs: jobs, importDone: summary,
      importError: saveFailures.length
        ? saveFailures.length + ' record' + (saveFailures.length > 1 ? 's' : '') + ' could not be saved: ' + saveFailures.join(', ')
        : (readErrors.length ? readErrors.length + ' file(s) could not be read: ' + readErrors.join('; ') : '')
    });
  }

    this.setState({
      view: 'detail', selectedId: id, activeTab: 'analysis',
      flaggingOpen: false, rejectingOpen: false, applyingOpen: false,
      notesEditing: false, questionsEditing: false, resumeEditing: false, coverEditing: false

            </div>
            <button type="button" class="btn btn-ghost" onclick="app.setState({applyingOpen:false})">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="app.moveJob('${job.id}','ready',document.getElementById('jd-apply-reason').value);app.setState({applyingOpen:false})">Move it</button>
          </div>
        ` : ''}
        ${flaggingOpen ? `
          <div class="card elev-sm" style="margin-bottom:var(--space-4);display:flex;flex-direction:row;gap:var(--space-2);align-items:flex-end">
            <div class="field" style="flex:1;margin:0">
              <label for="jd-flag-reason">Flag reason</label>
              <input id="jd-flag-reason" class="input" value="${escapeHtml(flagReasonInput)}" oninput="app.state.flagReasonInput=this.value" placeholder="e.g. salary range unconfirmed">
            </div>
            <button type="button" class="btn btn-ghost" onclick="app.setState({flaggingOpen:false})">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="app.moveJob('${job.id}','flagged',document.getElementById('jd-flag-reason').value);app.setState({flaggingOpen:false})">Flag it</button>
          </div>
        ` : ''}
        ${rejectingOpen ? `
          <div class="card elev-sm" style="margin-bottom:var(--space-4);display:flex;flex-direction:row;gap:var(--space-2);align-items:flex-end">
            <div class="field" style="flex:1;margin:0">
              <label for="jd-reject-reason">Reject reason</label>
              <input id="jd-reject-reason" class="input" value="${escapeHtml(rejectReasonInput)}" oninput="app.state.rejectReasonInput=this.value" placeholder="e.g. below salary floor">
            </div>
            <button type="button" class="btn btn-ghost" onclick="app.setState({rejectingOpen:false})">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="app.moveJob('${job.id}','rejected',document.getElementById('jd-reject-reason').value);app.setState({rejectingOpen:false})">Reject it</button>
          </div>
        ` : ''}

        <div style="display:flex;gap:var(--space-6);border-bottom:1px solid var(--color-divider);margin-bottom:var(--space-6)">${tabButtons}</div>
        ${content}
      </main>
    `;
  }

  startEditing(stateKey, boxId) {
    this.setState({ [stateKey]: true });
  }

  // Reads the live Quill document. Quill owns the DOM while editing, so the
  // stored value is whatever it holds at save time.
  saveDoc(jobId, field) {
    if (this._quill) {
      const html = this._quill.root.innerHTML;
      this.updateJobField(jobId, field, html === '<p><br></p>' ? '' : html);
    }
    this._quill = null;
    this.setState({ resumeEditing: false, coverEditing: false });
  }

  exportDoc(jobId, field, fmt) {
    if (!fmt) return;
    const job = this.state.jobs.find(j => j.id === jobId);
    if (!job) return;
    const html = cleanForExport(docToHtml(job[field]));
    // Strip parenthetical asides some company fields carry (e.g. "HireTalent
    // (staffing firm; end client undisclosed)") and sanitize filesystem-unsafe
    // characters, so exported filenames stay clean and readable.
    const cleanCompany = (job.company || 'Company').split('(')[0].trim().replace(/[\\/:*?"<>|]/g, '-');
    const cleanName = candidateName().replace(/[\\/:*?"<>|]/g, '-');
    const name = field === 'resume'
      ? `${cleanName} - UX Resume - ${cleanCompany}`
      : `${cleanName} - cover letter - ${cleanCompany}`;
    if (fmt === 'pdf') exportAsPdf(name, html);
    else if (fmt === 'docx') exportAsWord(name + '.doc', html);
  }

  attachEventListeners() {
    // Mount Quill whenever the render put an editor container on screen. One
    // continuous editable document, so Select All, cross-paragraph selection,
    // and typing anywhere behave the way any normal editor does.
    const want = this._pendingQuill;
    this._quill = null;
    if (!want) return;
    const el = document.getElementById(want.boxId);
    if (!el || typeof Quill === 'undefined') return;
    configureQuillOutput();
    const q = new Quill(el, {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ size: ['0.75em', false, '1.25em', '1.75em'] }],
          ['bold', 'italic'],
          [{ list: 'bullet' }],
          ['clean']
        ]
      }
    });
    if (want.html) q.clipboard.dangerouslyPasteHTML(want.html);
    q.focus();
    this._quill = q;
  }
}

const app = new App();
</script>
</body>
</html>
