<!DOCTYPE html>
<html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Applyr Lite — Application Tracker</title>
<style>
/* Modernist Design System — 1:1 port from Claude Design handoff */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap');

:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #6c4c93;
  --color-accent-2: #7a5aa0;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);

  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #ece0f5;
  --color-accent-200: #d6b9ec;
  --color-accent-300: #bd8de1;
  --color-accent-400: #a161d4;
  --color-accent-500: #8548b8;
  --color-accent-600: #6b3fa0;
  --color-accent-700: #4f2f78;
  --color-accent-800: #351f52;
  --color-accent-900: #1c1030;

  --color-accent-2-100: #ece0f5;
  --color-accent-2-800: #351f52;

  --color-ready-100: #dce6f5; --color-ready-700: #2f4f8a;
  --color-flagged-100: #f5e6c8; --color-flagged-700: #8a5a12;
  --color-rejected-100: #f5dcdc; --color-rejected-700: #8a3737;
  --color-applied-100: #dcefe3; --color-applied-700: #2f6b4f;
  --color-unassigned-100: #e7e5e5; --color-unassigned-700: #605d5d;
  --color-orange-100: #fbe0c4; --color-orange-700: #9a4b0f;

  --font-heading: "Archivo", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Archivo", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 16px; line-height: 1.55; font-weight: 400; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
html { overflow-y: scroll; scrollbar-gutter: stable; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--color-neutral-700); border-radius: 4px; }

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1, h2 { color: #4c4c4c; }
h1 { font-size: 42px; } h2 { font-size: 32px; } h3 { font-size: 25px; }
h4 { font-size: 20px; } h5 { font-size: 16px; } h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent-800); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-600); }

.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 15px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-accent) 10%, white); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-accent) 20%, white); }
.btn-ghost { color: var(--color-accent); border-color: transparent; }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 14%, white); border-color: color-mix(in srgb, var(--color-accent) 55%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 24%, white); }

.field > label { display: block; font-size: 14px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 16px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }

.card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface); }
.card-kicker { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 19px; line-height: 1.2; }
.elev-sm { box-shadow: var(--shadow-sm); }

.tag { display: inline-flex; align-items: center; font-size: 14px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: calc(var(--radius-md) * 0.75); }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }

.nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-divider); }
.nav a { color: inherit; text-decoration: none; font-size: 14px; }

.table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table th {
  text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td { padding: var(--space-2); border-bottom: 1px solid var(--color-divider); }
.table tbody tr:hover { background: color-mix(in srgb, var(--color-accent) 14%, white); }

/* Job-dashboard specific — exact classes from the design handoff */
.jd-bucket-card { transition: background .12s, border-color .12s; }
.jd-bucket-card:not(.jd-bucket-active):hover { background: color-mix(in srgb, white 55%, var(--color-surface)) !important; border-color: color-mix(in srgb, var(--color-accent) 45%, var(--color-neutral-800)) !important; }
.jd-bucket-card.jd-bucket-active:hover { background: color-mix(in srgb, white 30%, color-mix(in srgb, var(--color-accent) 10%, var(--color-surface))) !important; }

/* Nav + detail tabs: NOT .btn — underline-style, no button padding */
.jd-nav-tab, .jd-detail-tab {
  border: none; background: transparent; cursor: pointer; font: inherit;
  border-radius: var(--radius-md);
  padding-left: var(--space-2) !important; padding-right: var(--space-2) !important;
  margin-left: calc(var(--space-2) * -1); margin-right: calc(var(--space-2) * -1);
}
.jd-nav-tab:hover, .jd-detail-tab:hover { background: color-mix(in srgb, var(--color-accent) 14%, white); }

.jd-btn-reject:hover { background: color-mix(in srgb, var(--color-text) 14%, transparent) !important; }
.jd-btn-applied:hover { background: white !important; }
.jd-title-link:hover { text-decoration: underline !important; }

.jd-tooltip { position: relative; }
.jd-tooltip::after {
  content: attr(data-tooltip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--color-neutral-900); color: var(--color-neutral-100); font-size: 11px; line-height: 1.4;
  padding: 6px 10px; border-radius: var(--radius-sm); white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity .12s; box-shadow: var(--shadow-md); z-index: 10;
}
.jd-tooltip:hover::after { opacity: 1; }

.jd-select {
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23201e1d' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px !important;
}

main { padding: var(--space-8) var(--space-4); max-width: 1120px; width: 100%; margin: 0 auto; box-sizing: border-box; overflow-wrap: break-word; }
.card { overflow-wrap: break-word; }
.input { overflow-wrap: break-word; }
[contenteditable="true"] { outline: 1px dashed color-mix(in srgb, var(--color-accent) 40%, transparent); outline-offset: 2px; }
</style>

<style>/* Document typography.
   The read view uses .jd-doc, NOT .ql-editor, so Quill's stylesheet cannot
   reach it — Quill strips list bullets and adds its own indentation, which is
   right inside the editor and wrong everywhere else. Proportions here mirror
   the PDF/Word export so the screen matches the printed result. */
.jd-doc {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  color: var(--color-text);
}
.jd-doc h1 {
  font-family: var(--font-heading);
  font-weight: var(--font-heading-weight);
  font-size: 26px; line-height: 1.15;
  color: var(--color-text);
  margin: 0 0 10px;
}
.jd-doc h2 {
  font-family: var(--font-heading);
  font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.25;
  color: var(--color-text);
  margin: 20px 0 6px;
}
.jd-doc p { margin: 0 0 8px; }
.jd-doc ul { list-style: disc; padding-left: 24px; margin: 0 0 10px; }
.jd-doc li { list-style: disc; margin: 0 0 5px; padding-left: 0; line-height: 1.5; }
.jd-doc a { color: var(--color-accent); }
.jd-doc > *:first-child { margin-top: 0; }
.jd-doc > *:last-child { margin-bottom: 0; }

/* Editor chrome only. */
.ql-toolbar.ql-snow, .ql-container.ql-snow { border-color: var(--color-neutral-300); border-radius: 0; }
.ql-container.ql-snow { font-family: var(--font-body); font-size: 15px; }
.ql-editor { font-family: var(--font-body); line-height: 1.5; color: var(--color-text); }
.ql-editor h1 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; margin: 0 0 10px; }
.ql-editor h2 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px; margin: 20px 0 6px; }
.ql-editor p { margin: 0 0 8px; }
#jd-resume-box .ql-editor, #jd-cover-box .ql-editor { min-height: 420px; padding: 24px; }
</style>
<style>/* The duplicate marker sits in the company cell, which is uppercased and
   letter-spaced. Tooltips inherit both, so their text came out shouting. */
.jd-tooltip::after { text-transform: none; letter-spacing: normal; }
</style>
</head>

<script>
const BUCKET_LABELS = { ready: 'Ready to Apply', flagged: 'Flagged', rejected: 'Rejected', applied: 'Applied', unassigned: 'Unassigned' };
const TAB_LABELS = [['analysis','Analysis'],['notes','Notes & Questions'],['resume','Resume'],['coverletter','Cover Letter'],['portfolio','Portfolio Guidance']];
// ===================== PROFILE DATA — read from the user's folder ==========
// Nothing candidate-specific is baked into this file any more (D-02, D-11).
// The five .md files are read at launch from a folder the user picks once, so
// this object is empty until loadProfile() fills it. COVER_TEMPLATE, further
// down, is ENGINE — it ships unchanged to every user and must stay free of
// candidate-specific values.
const PROFILE = {
  candidate_profile: '', master_resume: '', voice_samples: '',
  ai_experience: '', case_studies: '', caseStudyList: []
};
// Field name -> the filename expected in the user's folder.
const PROFILE_FILES = [
  ['candidate_profile', 'candidate_profile.md'],
  ['master_resume',     'master_resume.md'],
  ['voice_samples',     'voice_samples.md'],
  ['ai_experience',     'ai_experience.md'],
  ['case_studies',      'portfolio_case_studies.md']
];
function profileLoaded() { return !!String(PROFILE.candidate_profile || '').trim(); }

// The case-study file is a plain markdown list: `- **Name** — description`.
// Any line that isn't one of those (headings, the file's own instructions) is
// ignored, so the file can explain itself to whoever edits it.
function parseCaseStudies(md) {
  const out = [];
  String(md || '').split('\n').forEach(line => {
    const m = line.match(/^\s*[-*]\s*\*\*(.+?)\*\*\s*[—–:-]\s*(.+?)\s*$/);
    if (m) out.push({ name: m[1].trim(), note: m[2].trim() });
  });
  return out;
}
function caseStudyLines() {
  return PROFILE.caseStudyList.map(c => '- ' + c.name + ': ' + c.note).join('\n');
}

// ---- the profile folder: picked once, remembered, re-read every launch ----
// A directory handle cannot go in localStorage; it only survives in IndexedDB.
// IndexedDB does work on a file:// page — that was verified before this was
// built, along with the folder picker itself. What is NOT guaranteed is that
// Chrome keeps the folder PERMISSION between launches, which is why a copy of
// the last good read is cached and used when permission has lapsed.
const PROFILE_DB = 'ja-lite';
const PROFILE_STORE = 'handles';
const PROFILE_HANDLE_KEY = 'profileFolder';
const PROFILE_CACHE_KEY = 'profile:cache';

// What the UI needs to say about where the profile came from.
const profileSource = {
  folderName: '', loadedAt: '', from: 'none', missing: [], error: ''
};

function idbOpen() {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(PROFILE_DB, 1); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = () => { req.result.createObjectStore(PROFILE_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const rq = db.transaction(PROFILE_STORE).objectStore(PROFILE_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PROFILE_STORE, 'readwrite');
    tx.objectStore(PROFILE_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function applyProfileTexts(texts) {
  PROFILE_FILES.forEach(([field]) => { PROFILE[field] = texts[field] || ''; });
  PROFILE.caseStudyList = parseCaseStudies(PROFILE.case_studies);
}
function cacheProfile(texts, folderName, missing) {
  try {
    window.localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify({
      texts, folderName, missing: missing || [], loadedAt: new Date().toISOString()
    }));
  } catch (e) { console.warn('Could not cache the profile:', e); }
}
function readProfileCache() {
  try {
    const v = window.localStorage.getItem(PROFILE_CACHE_KEY);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

// A missing file is not fatal on its own — only candidate_profile.md is, since
// nothing can be graded without it. The rest are reported and left empty.
async function readProfileFolder(handle) {
  const texts = {}, missing = [];
  for (const [field, filename] of PROFILE_FILES) {
    try {
      const fileHandle = await handle.getFileHandle(filename);
      texts[field] = await (await fileHandle.getFile()).text();
    } catch (e) { texts[field] = ''; missing.push(filename); }
  }
  return { texts, missing };
}

// interactive = this was called from a real click, so Chrome will allow a
// permission prompt. On boot it is false, and a lapsed permission falls
// through to the cached copy instead of throwing a dialog at the user.
async function loadProfile(interactive) {
  profileSource.error = '';
  let handle = null;
  try { handle = await idbGet(PROFILE_HANDLE_KEY); }
  catch (e) { profileSource.error = 'Could not read the remembered folder: ' + (e && e.message ? e.message : e); }

  if (handle) {
    let perm = 'prompt';
    try { perm = await handle.queryPermission({ mode: 'read' }); } catch (e) { perm = 'prompt'; }
    if (perm !== 'granted' && interactive) {
      try { perm = await handle.requestPermission({ mode: 'read' }); } catch (e) { perm = 'denied'; }
    }
    if (perm === 'granted') {
      const { texts, missing } = await readProfileFolder(handle);
      if (String(texts.candidate_profile || '').trim()) {
        applyProfileTexts(texts);
        cacheProfile(texts, handle.name, missing);
        profileSource.folderName = handle.name;
        profileSource.from = 'folder';
        profileSource.loadedAt = new Date().toISOString();
        profileSource.missing = missing;
        return profileSource;
      }
      profileSource.error = 'That folder has no candidate_profile.md, so there is nothing to grade against.';
      profileSource.missing = missing;
    }
  }

  const cached = readProfileCache();
  if (cached && cached.texts && String(cached.texts.candidate_profile || '').trim()) {
    applyProfileTexts(cached.texts);
    profileSource.folderName = cached.folderName || '';
    profileSource.from = 'cache';
    profileSource.loadedAt = cached.loadedAt || '';
    profileSource.missing = cached.missing || [];
    return profileSource;
  }

  profileSource.from = 'none';
  return profileSource;
}

// The folder picker needs a real click; it cannot be triggered on load.
async function pickProfileFolder() {
  if (typeof window.showDirectoryPicker !== 'function') {
    throw new Error('This browser cannot open a folder picker. Chrome is required.');
  }
  const handle = await window.showDirectoryPicker({ id: 'ja-lite-profile', mode: 'read' });
  await idbSet(PROFILE_HANDLE_KEY, handle);
  return loadProfile(true);
}
const COVER_TEMPLATE = "# Cover Letter Template \u2014 v2\n\n**For any posting mentioning AI/ML experience, represent the candidate's AI experience using `knowledge/ai_experience.md` (per profile) \u2014 never claim more or less than it states.**\n\n**Before writing, study `knowledge/voice_samples.md`.** Match its cadence: plain declarative sentences, colon-into-list for domains, concrete named proof over abstraction, warm-plain closings. The letter should read like the same person wrote these samples.\n\n## HARD LENGTH RULE \u2014 non-negotiable\nA finished cover letter is exactly 4 body paragraphs and no more than ~250 words total. If a draft exceeds 4 paragraphs or ~275 words, it is WRONG \u2014 cut it before finishing.\n- Do NOT add paragraphs beyond the 4-paragraph structure below.\n- Do NOT add a paragraph explaining domain gaps, experience gaps, or what you still need to learn about the company or industry. Paragraph 4's rules forbid that hedging. A gap is handled in zero sentences, not a paragraph.\n- When in doubt, cut. A letter that is too short is better than one that is too long.\n\n**Supersedes v1** (which was built from two letters Claude drafted for the\ncandidate in an earlier session \u2014 Ambience). v1's structure turned out to\nneed heavy rework in practice; this version is built directly from that\nrework, using the IDR posting as the live test case.\n\n**Provenance of the reference letter:** co-drafted \u2014 Claude produced an\ninitial draft, the candidate then edited it sentence by sentence, several\npasses, until the wording was exactly right. That editing process is\nitself part of what this template captures \u2014 see \"Expect iteration\"\nbelow.\n\n---\n\n## Structure\n\n**Opening \u2014 no title, greeting only**\nDo not add a title or header line above the greeting \u2014 no `# Cover Letter \u2014 [Company]`,\nno bold heading of any kind, nothing before the greeting at all. The letter's very first\nline is `Hello [Company],` written as plain body text, not an h1/h2/heading block, so it\nrenders at normal paragraph weight and size in both the live preview and PDF/Word export\n\u2014 not bold or oversized like a title would.\n\n**Paragraph 1 \u2014 Concrete hook, not a mirror (2 sentences)**\nName the exact role. Then connect it to a genuine, specific capability of the candidate's or to the specific hard problem this role solves, stated as a plain fact, not a metaphor or an emotional claim about design. Do NOT mirror back the candidate's own pitch in abstract terms.\n\n**Sharpen by getting MORE SPECIFIC to the actual work, never by getting more literary or dramatic.** If a draft opener feels flat, the fix is to name a more precise fact about the role or the candidate's background, not to reach for a bigger metaphor or a more dramatic claim about what design \"does.\"\n\n**Test:** If this sentence could appear in a letter to any other company unchanged, it's too generic \u2014 rewrite it. But anchor it with a fact, not a flourish.\n\n**BANNED fallback:** \"What stood out is the focus/emphasis on [design value] \u2014 that's exactly what I've spent my career doing.\" This restates the candidate's own pitch, not the company.\n\n**BANNED approach:** Describing the company's work in the candidate's abstract vocabulary (\"complex high-stakes workflows,\" \"clear scalable experiences\") as if it were their stated focus. It isn't.\n\n**BANNED approach:** Opening with a metaphor or a feeling about design (e.g. \"design either makes the complexity navigable or buries the user\"). If the first line performs an emotion or paints a picture instead of naming real work, it's wrong \u2014 even if it's specific to the company.\n\n**Good openers (from `knowledge/voice_samples.md` \u2014 study these as the model):**\n\n\"My past work designing for multiple distinct personas within one workflow, sounds like the type of experience you're looking for.\"\n\n\"Your Senior Product Designer role describes the type of work I specialize in: turning complex, high-stakes operational workflows into experiences that skilled teams can trust.\"\n\nNotice what these do: they name a real capability (multi-persona workflow design) or a real problem category (high-stakes operational workflows becoming trustworthy), stated as plain fact. Neither one performs an emotion or paints a picture \u2014 they just say what the work is.\n\n**Paragraph 2 \u2014 Bridge from Paragraph 1 without narrowing the whole career to the role's specialty (2 sentences)**\nOpen P2 by connecting to the specific problem P1 described, then state the background. But do NOT attach the full years of experience (see profile: years experience) to a single specialty the posting happens to want. Writing \"I've spent [years experience] years designing admin and operational workflows\" is inaccurate \u2014 the truth is [years experience] years across many kinds of enterprise design, of which that thread is one recurring subset.\n\n**Correct pattern:** state the broad claim honestly first, THEN present the role-relevant work as a recurring specialty within it.\n\n**Example shape:** \"I have [years experience] years designing enterprise software. In that time, I've repeatedly worked on this kind of problem: [echo P1's specifics].\"\n\nSentence 1: the honest broad claim \u2014 years + real domain list, stated plainly, not narrowed to flatter the posting.\n\nSentence 2: the specific thread within that broad career that answers P1's problem \u2014 this is where the echo of P1's language belongs, framed as a recurring pattern (\"I've repeatedly worked on...\", \"again and again I've...\"), not as the sum total of the career.\n\n**Rules:**\n- Use \"designing [X],\" never \"designing for [X]\" \u2014 the candidate designed these workflows, they didn't merely support them.\n- Do NOT reorder or re-weight the domain list (see profile: domains) per posting to front-load a weaker area. Keep domain emphasis factual, not tailored to flatter the reader.\n\n**BANNED as P2 opener:** Restating the generic value prop in abstract vocabulary (\"I take dense, high-stakes workflows and turn them into clear, scalable interaction patterns\"). State the background, but reach it through P1's specifics, not through boilerplate.\n\n**BANNED overclaim pattern:** Narrowing the full career (see profile: years experience) to a single specialty the posting wants (e.g. \"I've spent [years experience] years designing admin and operational workflows\" when admin/ops work is one recurring subset, not the whole career). State the broad truth first, then the specific thread.\n\n**Paragraph 3 \u2014 Concrete proof, two sentences, same employer (2 sentences)**\nOne project per sentence, named specifically, real detail about what it\nwas and what it did. Use \"I also built...\" (or similar) in sentence 2 to\nmake clear both examples are from the same tenure \u2014 don't let it read as\ntwo disconnected jobs. Pull from `portfolio_case_studies.md`, matched to\nposting relevance, same logic as resume tailoring.\n\n**Paragraph 4 \u2014 Direct close, no hedging (1\u20132 sentences)**\nState genuine interest in the actual work/role described. Do NOT include\nany version of \"I don't know enough about your company/mission to say\nmore\" \u2014 that reads as weak, not honest. If there's a real, specific\ncompany-mission connection, it can go here (see v1's mission-tone note,\nstill valid) \u2014 but if there isn't one, skip straight to a plain, direct\n\"I'd be excited to bring [specific things] to this role.\" No corporate\nsign-off like \"I look forward to hearing from you.\"\n\n**Every cover letter must end with a simple sign-off, on its own lines\nafter paragraph 4:**\n```\nBest,\n[sign-off name \u2014 see profile]\n```\nThis is separate from \u2014 and not a substitute for \u2014 keeping paragraph 4\nitself free of corporate closing language. Paragraph 4 stays a direct,\nsubstantive close; the sign-off is just the plain human \"Best, / [sign-off\nname]\" that ends the letter, matching the reference example below. Do not\nomit it, and do not embellish it into something longer like \"Best\nregards,\" \"Warm regards,\" or \"Sincerely.\"\n\nWork one portfolio-link sentence naturally into the closing or body\nparagraph, along these lines:\n\"I've included links to a couple of relevant case studies in my\nportfolio, including my work on [Case Study A] and [Case Study B], which\nI think speak directly to the kind of problem you're solving here.\"\n\nThe word \"portfolio\" in that sentence must be a real markdown link \u2014\nwrite it as `[portfolio](PORTFOLIO_LINK)` using the URL from the profile\n(see profile: portfolio link).\nLink the word \"portfolio\" once, not each case-study name \u2014 the portfolio\nURL is a single home page, not per-case-study deep links, so linking each\ncase study individually would falsely imply each name jumps to its own\npage. Case-study names themselves stay as plain text. The dashboard\nrenders this markdown-link syntax as a real clickable link in both the\nlive preview and PDF/Word exports.\n<!-- Note to Claude: when tailoring this cover letter for a specific job posting, replace [Case Study A] and [Case Study B] with 1-2 of the most relevant case studies for that posting (same set used in the resume's \"Highlighted for this role\" line \u2014 see `portfolio_case_studies.md` for the current active set, and profile: case studies for how many to recommend) as plain text \u2014 do not link them individually. Instead, format the word \"portfolio\" earlier in the sentence as a markdown link to the profile's portfolio link (see profile: portfolio link) \u2014 e.g. \"...a couple of relevant case studies in my [portfolio](PORTFOLIO_LINK), including my work on [Case Study A] and [Case Study B]...\". Keep the phrasing natural, not a repeated formatted callout. -->\n\n---\n\n## Voice rules (carried over from v1, still correct)\n\n- Plain language. No \"passionate,\" \"thrilled,\" \"leverage,\" \"evangelize,\"\n  \"synergy.\"\n- No inflated claims \u2014 paragraph 3 proof must be things that actually\n  happened, stated plainly.\n- Avoid abstract/soft-focus phrasing that could be read as hedging or\n  avoidance \u2014 e.g. earlier drafts of paragraph 2 tried \"without hiding the\n  complexity underneath,\" which sounded like the candidate always exposes\n  system complexity, when the real point is that the candidate *makes the\n  underlying logic clear to users*, exposing it exactly as much as they need \u2014 a design\n  judgment call, not a blanket philosophy. Precision here matters more\n  than it looks like it should.\n- Short sentences. Cutting a paragraph into two shorter sentences is\n  almost always an improvement \u2014 it happened three separate times in the\n  IDR draft and made it stronger each time.\n\n**Punctuation: do not use an em dash in cover letters at all.** The em dash is grammatically valid, but leaning on it reads as machine-written. Instead, choose the mark the sentence calls for:\n  - A colon when what follows explains or specifies what came before\n  - A comma for a light pause or an appositive\n  - A period when it is really two sentences; split into two\n\n---\n\n## Expect iteration\n\nThe IDR letter took multiple real editing passes to land \u2014 the strength\nsentence in paragraph 2 alone went through five or six versions before it\nwas right. That's normal, not a sign the template failed. First draft\nfrom this template should be treated as a starting point for the\ncandidate to edit line by line, not a finished letter. Don't try to get\nthe \"perfect\" first draft \u2014 get a reasonable structural draft, then work\nit with the candidate the way the IDR one was worked.\n\n---\n\n## Mission-tone modulation (still not active \u2014 pending analyzer decision)\n\nUnchanged from v1: if/when the mission-fit axis in `job_analyzer.md` goes\nlive, paragraph 4 can lean into genuine mission alignment for companies\nthat earn it (i.e., companies whose mission genuinely resonates with the\ncandidate \u2014 a judgment call, not a fixed list). Until then, paragraph 4\ndefault is the plain, direct close shown above \u2014 not forced heroics, not\nan apology for not knowing the company.\n\n---\n\n## Reference example (IDR posting, unnamed client, final version)\n\nHello [Company Name],\n\nI'm interested in the Senior/Lead UX Designer role. What stood out is the\ncall for experience incorporating AI into design workflows, which I'm\nvery interested in and actively working on right now.\n\nOver [years experience] years designing enterprise software across\n[domain list \u2014 see profile: domains], I've repeatedly worked on exactly\nthis kind of problem: turning dense, technical workflows into something\nexperts can act on with confidence. Right now I'm actively building AI\ntools into my own process, using them to accelerate research synthesis,\nprototyping, and early ideation, which is the same kind of workflow\nleverage the role calls for.\n\nAt [past employer], I redesigned [Case Study A], a required configuration\nworkflow used by every customer. I also built [Case Study B], a shared\nlibrary of patterns and templates that helped design and engineering\nteams stop solving the same problems repeatedly.\n\nI'd be excited to bring my experience with complex workflows, design\nsystems, and cross-functional collaboration to this role.\n\nBest,\n[sign-off name \u2014 see profile]\n\n---\n\n## Open question for the candidate\n\nNone currently. Next real posting (not a test case) should go through\nthis version live \u2014 if it still needs this much rework, the structure\nitself may need another pass rather than just the wording.\n";

// ---- API key: stored in this browser only, never sent anywhere but Anthropic ----
const API_KEY_STORAGE = 'cfg:apiKey';
function getApiKey() {
  try { return window.localStorage.getItem(API_KEY_STORAGE) || ''; } catch (_) { return ''; }
}
function setApiKey(key) {
  try { window.localStorage.setItem(API_KEY_STORAGE, String(key || '').trim()); return true; }
  catch (_) { return false; }
}
function hasApiKey() { return getApiKey().length > 0; }

async function gradePosting(postingText, sourceUrl) {
  const key = getApiKey();
  if (!key) throw new Error('No API key saved yet. Add one on the Add Job screen.');
  if (!profileLoaded()) throw new Error('No profile loaded. Choose your profile folder on the Add Job screen.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      // Required for calls made straight from a browser page.
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      // Grading model. One line to change (e.g. back to 'claude-sonnet-5').
      model: 'claude-opus-5',
      // A ceiling, not a purchase: you are billed only for tokens actually
      // generated. Set high so a full verdict is never cut off mid-write.
      max_tokens: 8000,
      // The criteria block is identical on every call, so it is cached: the first
      // posting in a run pays full price, the rest pay 10% on that block.
      system: [{ type: 'text', text: graderSystem(), cache_control: { type: 'ephemeral' } }],
      messages: [{ role: 'user', content: 'Grade this job posting.\n\n' + (sourceUrl ? 'Source URL: ' + sourceUrl + '\n\n' : '') + postingText }]
    })
  });
  if (!res.ok) {
    let detail = '';
    try { const e = await res.json(); detail = (e && e.error && e.error.message) || ''; } catch (_) {}
    if (res.status === 401) throw new Error('The API key was rejected. Check it was copied in full.');
    if (res.status === 429) throw new Error('Rate limited, or the account is out of credit. Check billing at console.anthropic.com.');
    throw new Error('The grader returned ' + res.status + (detail ? ': ' + detail : '') + '.');
  }
  const data = await res.json();
  if (data.stop_reason === 'max_tokens') throw new Error('The grader hit the ' + 8000 + '-token output ceiling. The posting is unusually long, or the ceiling needs raising.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
  const cleaned = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  let parsed;
  try { parsed = JSON.parse(cleaned); }
  catch (e) {
    const start = cleaned.indexOf('{'), end = cleaned.lastIndexOf('}');
    if (start === -1 || end <= start) throw new Error('The grader did not return usable JSON.');
    parsed = JSON.parse(cleaned.slice(start, end + 1));
  }
  return parsed;
}

// Fit-list items come in two shapes: the current structured form
// {tone, text}, and plain strings from jobs graded before that existed —
// those often lead with "Green:" or "Red:", so strip and honour it.
function readToneItem(item) {
  if (item && typeof item === 'object') {
    const tone = item.tone === 'green' || item.tone === 'red' ? item.tone : 'none';
    return { tone, text: String(item.text || '') };
  }
  const raw = String(item || '');
  const m = raw.match(/^\s*(green|red)\s*(?:flag)?\s*[:\-–—]\s*/i);
  if (m) return { tone: m[1].toLowerCase(), text: raw.slice(m[0].length) };
  return { tone: 'none', text: raw };
}

async function callClaude(system, userText, maxTokens) {
  const key = getApiKey();
  if (!key) throw new Error('No API key saved yet. Add one on the Add Job screen.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-5',
      max_tokens: maxTokens,
      system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
      messages: [{ role: 'user', content: userText }]
    })
  });
  if (!res.ok) {
    let detail = '';
    try { const e = await res.json(); detail = (e && e.error && e.error.message) || ''; } catch (_) {}
    if (res.status === 401) throw new Error('The API key was rejected.');
    if (res.status === 429) throw new Error('Rate limited, or out of credit.');
    throw new Error('Claude returned ' + res.status + (detail ? ': ' + detail : '') + '.');
  }
  const data = await res.json();
  if (data.stop_reason === 'max_tokens') {
    // Keep the evidence. When this fires we want to know whether the model
    // genuinely wrote too much, or whether non-text blocks ate the budget --
    // the filter below only counts text, so anything else is invisible in the
    // draft but still spends the ceiling.
    const blockTypes = (data.content || []).map(b => b.type).join(', ') || 'none';
    const outputTokens = (data.usage && data.usage.output_tokens) || 0;
    const partial = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    console.warn('[job-applyr] hit the max_tokens ceiling', {
      maxTokens: maxTokens,
      outputTokens: outputTokens,
      blockTypes: blockTypes,
      partialChars: partial.length,
      response: data
    });
    throw new Error(
      'The response was cut off at the ' + maxTokens + '-token ceiling (' +
      outputTokens + ' generated, blocks: ' + blockTypes + ', ' + partial.length +
      ' characters of text). The full response is logged to the browser console.'
    );
  }
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
  return text.replace(/^```(?:markdown|md)?\s*/i, '').replace(/```\s*$/, '').trim();
}

function postingBlock(job) {
  return [
    'Job posting:',
    'Company: ' + (job.company || ''),
    'Title: ' + (job.title || ''),
    'Location: ' + (job.location || ''),
    '',
    job.fullPosting || ''
  ].join('\n');
}

async function generateResume(job) {
  return callClaude(resumeSystem() + '\n\n' + materialsContext(job), postingBlock(job), 4000);
}
async function generateCoverLetter(job) {
  // A ceiling, not a purchase: you are billed only for tokens actually
  // generated, so a high ceiling on a ~275-word letter costs nothing. This was
  // 2000 and reliably cut letters off; the grader has never hit 8000.
  return callClaude(coverSystem() + '\n\n' + materialsContext(job), postingBlock(job), 8000);
}

const VERDICT_BUCKET = { APPLY: 'ready', FLAG: 'flagged', REJECT: 'rejected' };

// ---- persistence: the browser's own storage, on this computer ----
// Lite has no backend. Every job is ONE JSON object under key job:<date>-<company>;
// transient view state lives separately under ui:state so it never collides with a job.
const JOB_PREFIX = 'job:';
const PENDING_PREFIX = 'pending:';
const UI_STATE_KEY = 'ui:state';
// One-time data migrations record themselves here so they don't re-run on every
// launch. Neither prefix above matches it, so it never reads back as a job.
const MIGRATION_KEY = 'meta:migrations';
// Build identifier. Logged on boot only — two builds are otherwise
// indistinguishable once the file is open.
const APP_VERSION = '23';

// Duplicate-row marking. The red is the design system's existing
// --color-rejected-700; the yellow is new, deliberately not --color-flagged-100,
// because that tan is the Flagged bucket's own card colour and a duplicate
// sitting in Flagged would have disappeared into it.
const DUPE_MARK = '#8a3737';
const DUPE_HIGHLIGHT = '#fbf0a3';

// Storage keys can't contain whitespace, slashes, or quotes.
function slugify(s) {
  return String(s || '')
    .split('(')[0]
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60) || 'unknown';
}
function storageKeyFor(job) {
  const date = job.addedDate || todayLocal();
  return JOB_PREFIX + date + '-' + slugify(job.company);
}
// Both storageKey and id are company+date, so two postings from the same
// company added the same day collide. A colliding id is worse than a colliding
// key: every read is jobs.find(j => j.id === id) and hits only the first
// record, while every write is jobs.map(j => j.id === id ? ...) and hits both.
// Same suffix treatment for both.
function uniqueValue(base, taken) {
  if (!taken.has(base)) return base;
  let n = 2;
  while (taken.has(base + '-' + n)) n++;
  return base + '-' + n;
}
// Normalized company+title identity, used to spot a job already in the tracker.
// Company names arrive inconsistently, especially via agencies: the same role
// can read "Glocomms (client: Clay)" one time and "Clay (via Glocomms
// Recruiting)" the next. Reduce a company string to the set of real names it
// mentions, so those two recognise each other.
const COMPANY_NOISE = new Set([
  'client', 'via', 'through', 'for', 'recruiting', 'recruitment', 'recruiters',
  'agency', 'staffing', 'talent', 'partners', 'search', 'group', 'consulting',
  'inc', 'llc', 'ltd', 'limited', 'corp', 'corporation', 'co', 'the', 'and', 'on', 'behalf', 'of',
  // Placeholders, not names. Without these, "client unnamed" makes identifyingTokens()
  // treat "unnamed" as the employer and discard the agency's real name, so two records
  // for one job stop matching. See D-19.
  'unnamed', 'undisclosed', 'confidential', 'unknown', 'anonymous', 'stealth', 'various'
]);
function companyTokens(company) {
  const parts = String(company || '')
    .toLowerCase()
    .replace(/\bon behalf of\b/g, '|')
    .split(/[()\[\],:;\/|]|\bvia\b|\bclient\b|\bfor\b|\bthrough\b/)
    .map(p => p.replace(/[^a-z0-9]+/g, ' ').trim())
    .filter(Boolean);
  const out = new Set();
  for (const part of parts) {
    const kept = part.split(' ').filter(w => w && !COMPANY_NOISE.has(w));
    if (kept.length) out.add(kept.join('-'));
  }
  return out;
}

// A name carrying agency words identifies the recruiter, not the employer.
// Two unrelated roles from the same agency must not look like one job, so
// agency names are only used when nothing else identifies the company.
const AGENCY_WORDS = /\b(recruit\w*|staffing|talent|search|headhunt\w*|agency|consultanc\w*)\b/i;
function identifyingTokens(company) {
  const raw = String(company || '').toLowerCase();
  const all = companyTokens(company);
  if (all.size < 2) return all;

  // Markers point in opposite directions: "X (client: Y)" names Y as the
  // employer, while "Y (via X)" names X as the middleman. Honour each.
  const namesEmployer = raw.match(/\b(?:client|on behalf of)\b\s*:?\s*([^)\],;|]+)/);
  if (namesEmployer) {
    const t = companyTokens(namesEmployer[1]);
    if (t.size) return t;
  }
  const namesAgency = raw.match(/\b(?:via|through)\b\s*:?\s*([^)\],;|]+)/);
  if (namesAgency) {
    const mid = companyTokens(namesAgency[1]);
    const kept = new Set([...all].filter(t => !mid.has(t)));
    if (kept.size) return kept;
  }

  const segments = raw.split(/[()\[\],:;\/|]/).map(s => s.trim()).filter(Boolean);
  const agency = new Set();
  for (const seg of segments) {
    if (AGENCY_WORDS.test(seg)) for (const t of companyTokens(seg)) agency.add(t);
  }
  const kept = new Set([...all].filter(t => !agency.has(t)));
  return kept.size ? kept : all;
}

function matchKeyFor(job) {
  return slugify(job.company) + '|' + slugify(job.title);
}

// Same role if the title matches and the two company strings name any company
// in common. Falls back to the plain key when no usable tokens survive.
function isSameRole(a, b) {
  if (slugify(a.title) !== slugify(b.title)) return false;
  const ta = identifyingTokens(a.company), tb = identifyingTokens(b.company);
  if (!ta.size || !tb.size) return matchKeyFor(a) === matchKeyFor(b);
  for (const t of ta) if (tb.has(t)) return true;
  return false;

// A re-applied job is a legitimate new row, not something to block — so this
// records the prior history on the new record rather than refusing the add.
function buildDuplicateCheck(job, existingJobs) {
  const mk = matchKeyFor(job);
  const priors = (existingJobs || []).filter(j => j.storageKey !== job.storageKey && isSameRole(j, job));
  return {
    matchKey: mk,
    isReapply: priors.length > 0,
    priorKeys: priors.map(j => j.storageKey),
    priorAppliedDates: priors.map(j => j.appliedDate || '').filter(Boolean)

}

const store = {
  mode: 'unknown',            // 'persistent' once localStorage answers, else 'memory'
  probe: '',                  // what we actually found, shown in the UI
  _mem: new Map(),

  // Real browser storage. Verified by an actual round-trip, not a typeof check:
  // Safari private browsing exposes localStorage but throws on write.
  async init() {
    try {
      const probeKey = '__ja_probe__';
      window.localStorage.setItem(probeKey, '1');
      const back = window.localStorage.getItem(probeKey);
      window.localStorage.removeItem(probeKey);
      if (back !== '1') throw new Error('value did not survive the round-trip');
      this.mode = 'persistent';
      this.probe = 'browser storage responded';
    } catch (err) {
      this.mode = 'memory';
      this.probe = 'browser storage unavailable: ' + (err && err.message ? err.message : 'unknown error')
        + '. If this file is open inside Claude, download it and open it in your browser instead.';
    }
    return this.mode;
  },

  persistent() { return this.mode === 'persistent'; },
  available() { return this.mode !== 'unknown'; },

  // ---- one low-level pair, so every caller behaves the same in both modes ----
  async _get(key) {
    if (this.persistent()) { const v = window.localStorage.getItem(key); return v === null ? null : v; }
    return this._mem.has(key) ? this._mem.get(key) : null;
  },
  async _set(key, value) {
    if (this.persistent()) { window.localStorage.setItem(key, value); return; }
    this._mem.set(key, value);
  },
  async _delete(key) {
    if (this.persistent()) { window.localStorage.removeItem(key); return; }
    this._mem.delete(key);
  },
  async _list(prefix) {
    if (this.persistent()) {
      const out = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith(prefix)) out.push(k);
      }
      return out;
    }
    return [...this._mem.keys()].filter(k => k.startsWith(prefix));
  },

  async _readAll(prefix) {
    const keys = await this._list(prefix);
    const out = await Promise.all(keys.map(async (key) => {
      try {
        const v = await this._get(key);
        if (!v) return null;
        const rec = JSON.parse(v);
        rec.storageKey = key;
        return rec;
      } catch (e) { console.warn('Skipping unreadable record:', key, e); return null; }
    }));
    return out.filter(Boolean);
  },

  async listJobs() { return this._readAll(JOB_PREFIX); },

  async saveJob(job) {
    const key = job.storageKey || storageKeyFor(job);
    job.storageKey = key;
    try { await this._set(key, JSON.stringify(job)); return true; }
    catch (e) { console.error('Failed to save job:', key, e); return false; }
  },

  async deleteJob(key) {
    try { await this._delete(key); return true; }
    catch (e) { console.error('Failed to delete job:', key, e); return false; }
  },

  async listPending() {
    const items = await this._readAll(PENDING_PREFIX);
    return items.sort((a, b) => (a.savedAt || '').localeCompare(b.savedAt || ''));
  },

  async savePending(item) {
    try { await this._set(item.storageKey, JSON.stringify(item)); return true; }
    catch (e) { console.error('Failed to save pending posting:', e); return false; }
  },

  async deletePending(key) {
    try { await this._delete(key); return true; }
    catch (e) { console.error('Failed to delete pending posting:', key, e); return false; }
  },

  async getUiState() {
    try { const v = await this._get(UI_STATE_KEY); return v ? JSON.parse(v) : {}; }
    catch (e) { return {}; }
  },

  async saveUiState(obj) {
    try { await this._set(UI_STATE_KEY, JSON.stringify(obj)); } catch (e) {}
  },

  async getMigrations() {
    try { const v = await this._get(MIGRATION_KEY); return v ? JSON.parse(v) : {}; }
    catch (e) { return {}; }
  },

  async saveMigrations(obj) {
    try { await this._set(MIGRATION_KEY, JSON.stringify(obj)); return true; }
    catch (e) { console.error('Failed to record migration:', e); return false; }
  }
};

// The user's own calendar day. toISOString() is UTC: after 5pm Pacific it has

function todayLocal() {

  const pad = n => String(n).padStart(2, '0');

function formatDate(iso) {

  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m, 10) - 1] + ' ' + parseInt(d, 10);

function parseSalary(s) {

  while ((match = urlPattern.exec(text)) !== null) {
    let url = match[0];
    // Trim trailing punctuation that's likely not part of the URL.
    let trailing = '';
    while (url.length && /[),.;:!?]$/.test(url)) {

    out += escapeHtml(text.slice(lastIndex, match.index));
    out += `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="color:var(--color-accent-600);text-decoration:underline">${escapeHtml(url)}</a>`;
    out += escapeHtml(trailing);
    lastIndex = match.index + match[0].length;

}

    lastIndex = match.index + match[0].length;

// ---- markdown-lite <-> editable content blocks (used by Resume + Cover Letter tabs) ----
function parseMarkdownLite(text) {
  const lines = (text || '').split('\n');
  const blocks = [];
  lines.forEach((line, i) => {
    const t = line.trim();
    if (!t) return;
    if (t.indexOf('## ') === 0) blocks.push({ id: 'b' + i, type: 'h2', text: t.slice(3) });
    else if (t.indexOf('# ') === 0) blocks.push({ id: 'b' + i, type: 'h1', text: t.slice(2) });
    else if (t.indexOf('- ') === 0) blocks.push({ id: 'b' + i, type: 'bullet', text: '•  ' + t.slice(2).replace(/\*\*(.*?)\*\*/g, '$1') });
    else if (t.indexOf('**') === 0) blocks.push({ id: 'b' + i, type: 'jobheader', text: t.replace(/\*\*(.*?)\*\*/g, '$1') });
    else if (/^\*(?!\*)(.+)\*$/.test(t)) blocks.push({ id: 'b' + i, type: 'italic', text: t.replace(/^\*(.+)\*$/, '$1') });
    else blocks.push({ id: 'b' + i, type: 'text', text: t.replace(/\*\*(.*?)\*\*/g, '$1') });
  });

}
function blockStyle(type) {
  if (type === 'h1') return 'font-family:var(--font-heading);font-weight:500;font-size:20px;margin:0 0 var(--space-4);outline:none';
  if (type === 'h2') return 'font-family:var(--font-heading);font-weight:500;font-size:15px;margin:var(--space-6) 0 var(--space-2);outline:none';
  if (type === 'jobheader') return 'font-weight:600;color:var(--color-text);margin:var(--space-4) 0 var(--space-1);line-height:1.5;outline:none';
  if (type === 'italic') return 'font-style:italic;color:var(--color-neutral-700);margin:0 0 var(--space-2);line-height:1.55;outline:none';
  if (type === 'bullet') return 'margin:0 0 var(--space-2);padding-left:var(--space-3);color:var(--color-neutral-700);line-height:1.65;outline:none';
  return 'margin:0 0 var(--space-3);color:var(--color-neutral-700);line-height:1.7;outline:none;font-weight:400;font-size:14px';

function reconstructMarkdown(container) {
  const divs = Array.prototype.slice.call(container.querySelectorAll('[data-blk]'));
  return divs.map(div => {
    const type = div.getAttribute('data-blk');
    const raw = (div.innerText || '').replace(/\s+/g, ' ').trim();
    if (!raw) return null; // drop blocks left empty by editing (e.g. an unused split)
    if (type === 'h1') return '# ' + raw;
    if (type === 'h2') return '## ' + raw;
    if (type === 'bullet') return '- ' + raw.replace(/^•\s*/, '');
    if (type === 'jobheader') return '**' + raw + '**';
    if (type === 'italic') return '*' + raw + '*';
    return raw;

// Pressing Enter inside an editable resume/cover-letter block splits it into two
// sibling blocks at the cursor position, instead of doing nothing useful — by default
// a plain contenteditable div has nowhere for a line break to go (there's no sibling
// [data-blk] element for it to land in), so Enter appeared completely broken: no new
// paragraph appeared, and reconstructMarkdown collapsed any stray internal newline
// back into a single space on save anyway. This makes Enter do what editing a resume/
// cover letter actually needs: start a new paragraph/bullet at the cursor.
function splitEditableBlock(el) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);

  const beforeRange = document.createRange();
  beforeRange.selectNodeContents(el);
  beforeRange.setEnd(range.startContainer, range.startOffset);
  const beforeText = beforeRange.toString();

  const afterRange = document.createRange();
  afterRange.selectNodeContents(el);
  afterRange.setStart(range.startContainer, range.startOffset);
  const afterText = afterRange.toString();

  const type = el.getAttribute('data-blk');
  el.textContent = beforeText;

  const newEl = document.createElement('div');
  newEl.setAttribute('data-blk', type);
  newEl.setAttribute('contenteditable', 'true');
  newEl.setAttribute('style', el.getAttribute('style') || '');
  newEl.textContent = (type === 'bullet' && !/^•/.test(afterText)) ? ('•  ' + afterText) : afterText;

  el.parentNode.insertBefore(newEl, el.nextSibling);
  attachBlockSplitHandler(newEl);

  const newRange = document.createRange();
  if (newEl.firstChild) newRange.setStart(newEl.firstChild, 0);
  else newRange.setStart(newEl, 0);
  newRange.collapse(true);
  sel.removeAllRanges();

}
function attachBlockSplitHandler(el) {

// Converts parsed blocks into real block-level HTML (h1/h2/p/ul-li, not just
// plain text separated by blank lines) so exported documents keep visible
// paragraph/heading/list structure instead of reading as one continuous
// run-on block of text \u2014 this matters most for the Word export, since
// Word's HTML-import doesn't reliably honor `white-space:pre-wrap`.
// Consecutive bullet blocks are grouped into a single <ul>.
// ---- documents are stored as HTML ----
// Markdown could not express font size or weight, so anything the toolbar
// applied would silently vanish on save. HTML holds whatever Quill produces.
// Documents written before this change are still markdown; they convert on
// read, using the same two functions the old renderer used.
// Quill writes font size as a CSS class (ql-size-large) that only exists in
// Quill's own stylesheet, and writes bullets as <ol> styled by that same CSS.
// Exported Word and PDF files carry no such stylesheet, so size would vanish
// and bullets would render as a numbered list. Registering the style
// attributor writes size inline instead, and cleanForExport fixes the lists.
function configureQuillOutput() {
  if (typeof Quill === 'undefined' || configureQuillOutput.done) return;
  try {
    const SizeStyle = Quill.import('attributors/style/size');
    SizeStyle.whitelist = ['0.75em', '1.25em', '1.75em'];
    Quill.register(SizeStyle, true);
    configureQuillOutput.done = true;

function cleanForExport(html) {
  const d = document.createElement('div');
  d.innerHTML = String(html || '');
  d.querySelectorAll('span.ql-ui').forEach(el => el.remove());
  d.querySelectorAll('ol').forEach(ol => {
    const items = Array.prototype.slice.call(ol.children);
    if (!items.length || !items.every(li => li.getAttribute('data-list') === 'bullet')) return;
    const ul = document.createElement('ul');
    ul.setAttribute('style', 'margin:0 0 12pt;padding-left:20pt');
    items.forEach(li => {
      const nli = document.createElement('li');
      nli.setAttribute('style', 'margin-bottom:6pt;line-height:1.5');
      nli.innerHTML = li.innerHTML;
      ul.appendChild(nli);
    });
    ol.parentNode.replaceChild(ul, ol);
  });
  d.querySelectorAll('[data-list]').forEach(el => el.removeAttribute('data-list'));

  // have to be written onto the elements themselves. Anything already carrying
  // a style (a size set from the toolbar, or an older migrated document) wins.
  const PRINT = {
    H1: 'font-size:18pt;font-weight:700;margin:0 0 12pt',
    H2: 'font-size:13pt;font-weight:700;margin:18pt 0 8pt',
    P:  'margin:0 0 10pt;line-height:1.5;font-size:11pt',
    UL: 'margin:0 0 12pt;padding-left:20pt',
    LI: 'margin-bottom:6pt;line-height:1.5'
  };
  Object.keys(PRINT).forEach(tag => {
    d.querySelectorAll(tag.toLowerCase()).forEach(el => {
      const existing = el.getAttribute('style');
      if (existing && existing.indexOf(PRINT[tag]) !== -1) return;
      el.setAttribute('style', existing ? PRINT[tag] + ';' + existing : PRINT[tag]);

      + '</ul>';

    + '<style>:root{--color-accent-600:#6b3fa0} body{font-family:\'Archivo\',system-ui,sans-serif;font-size:11pt}</style></head>'
    + '<body>' + bodyHtml + '</body></html>';

  w.document.write('<html><head><title>' + escapeHtml(title) + '</title><style>@import url(\'https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap\');:root{--color-accent-600:#6b3fa0}</style></head><body style="font-family:\'Archivo\',system-ui,sans-serif;padding:48px;max-width:700px;margin:0 auto;font-size:11pt;font-weight:400">' + bodyHtml + '</body></html>');

  // a fixed short timeout risked printing with the font still unloaded

    w.document.fonts.ready.then(triggerPrint).catch(triggerPrint);
    setTimeout(triggerPrint, 1500); // hard fallback in case fonts.ready never resolves
  } else {
    setTimeout(triggerPrint, 500);
  }
}

function normalizeJob(raw, existingJobs) {
